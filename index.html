<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Samurai Barber · Gestión</title>
<script>
// Tema: se resuelve antes de pintar para evitar el parpadeo. 'auto' sigue al sistema.
(function(){
  var t='auto';
  try{ t=localStorage.getItem('samurai-v2-theme')||'auto'; }catch(e){}
  var dark = t==='dark' || (t==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
})();
</script>
<style>
/* =====================================================================
   SAMURAI BARBER · Gestión interna del barbero
   Un solo archivo. Compatible con Chrome 109 (Windows 7): sin :has(),
   sin container queries, sin nesting, sin color-mix, sin dvh.
   Secciones:  1) Tokens y base   2) Layout y navegación   3) Agenda (Hoy)
               4) Sheet / alta    5) Clientes   6) Semana   7) Caja
               8) Productos       9) Animaciones y utilidades
   ===================================================================== */

/* ---------- 1) Tokens ---------- */
:root{ color-scheme:light;
  --bg:#f1ece3; --bg2:#e9e2d5; --card:#fffdf9; --card2:#f7f2e9; --card3:#efe9dd;
  --ink:#17161a; --ink2:#4f4c47; --mut:#6f6a62; --line:#e2dbce; --line2:#cfc6b5;
  --red:#b3302b; --red2:#d4463f; --red-bg:#f8e3e1; --gold:#7f6118; --gold-bg:#f6ecd2; --cream:#f5efe4;
  --online:#4659c9; --online-bg:#e6e9fa; --silla:#9a6107; --silla-ink:#fff; --silla-bg:#fbeed3; --ok:#2a8a55; --ok-bg:#dff2e6; --no:#8a857c; --no-bg:#ebe8e1;
  --shadow:0 1px 2px rgba(30,20,10,.06),0 8px 24px rgba(30,20,10,.08);
  --shadow-lg:0 2px 6px rgba(30,20,10,.1),0 24px 60px rgba(30,20,10,.22);
  --r:14px; --r-sm:10px; --nav-h:64px; --slot:58px; --side-w:236px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme=dark]{ color-scheme:dark;
  --bg:#0e0e11; --bg2:#141418; --card:#1a1a1f; --card2:#212127; --card3:#2a2a31;
  --ink:#f1ece3; --ink2:#c9c3b8; --mut:#8e897f; --line:#2a2a31; --line2:#3a3a42;
  --red:#e2493f; --red2:#f0655c; --red-bg:#3a1b19; --gold:#d8b25f; --gold-bg:#3a2f14; --cream:#f1ece3;
  --online:#8d9cf4; --online-bg:#23294a; --silla:#f0b34a; --silla-ink:#1a1200; --silla-bg:#3b2d12; --ok:#4fc37f; --ok-bg:#143d26; --no:#8e897f; --no-bg:#26262b;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 2px 6px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.6);
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
:focus{outline:none}
:focus-visible{outline:3px solid var(--online);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
::selection{background:var(--red);color:#fff}

/* ---------- 2) Layout ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;flex:none}
.brand b{font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
.top-row .grow{flex:1}
.ibtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);background:transparent;transition:background .15s,transform .1s}
.ibtn:hover{background:var(--card2)}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:22px;height:22px}
.view{display:none;flex:1;padding:0 0 calc(var(--nav-h) + 16px)}
.view.on{display:block;animation:fadeUp .25s ease both}
.wrap{padding:0 16px;max-width:1120px;margin:0 auto;width:100%}

/* Navegación inferior (celular) */
.nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);position:relative;transition:color .15s}
.nav button svg{width:24px;height:24px;transition:transform .2s}
.nav button.on{color:var(--red)}
.nav button.on svg{transform:translateY(-2px)}
.nav button.on::after{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--red)}
.nav .badge{position:absolute;top:8px;left:50%;margin-left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;padding:0 4px;text-align:center}

/* Escritorio: barra lateral + contenido ancho */
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:var(--side-w);flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:18px 14px}
  .side .brand{padding:4px 8px 18px}
  .side .brand .logo{width:40px;height:40px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--ink2);text-align:left;transition:background .15s,color .15s}
  .side nav button svg{width:22px;height:22px}
  .side nav button:hover{background:var(--card2)}
  .side nav button.on{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(179,48,43,.3)}
  .side .badge{margin-left:auto;background:var(--gold-bg);color:var(--gold);font-size:11px;border-radius:9px;padding:1px 7px}
  .side nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
  .side .foot button{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;color:var(--ink2);font-size:13px}
  .side .foot button:hover{background:var(--card2)}
  .side .foot svg{width:18px;height:18px}
  .nav{display:none}
  .view{padding-bottom:32px}
  .top-row{padding:14px 24px 8px}
  .top .brand{display:none}
  .wrap{padding:0 24px}
}


/* ---------- 3) Agenda (Hoy) ---------- */
.weekstrip{display:flex;align-items:center;gap:4px;padding:4px 10px 10px}
.weekstrip .arrow{width:40px;height:44px;flex:none;color:var(--mut)}
.weekstrip .days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daychip{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60px;border-radius:12px;color:var(--ink2);transition:background .15s,transform .15s;position:relative}
.daychip small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.daychip b{font-size:17px;line-height:1.1}
.daychip i{font-style:normal;font-size:10px;color:var(--mut);margin-top:2px;height:12px}
.daychip:hover{background:var(--card2)}
.daychip.on{background:var(--ink);color:var(--bg)}
.daychip.on small,.daychip.on i{color:var(--bg);opacity:.75}
.daychip.today::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.daychip.on.today::after{background:var(--red2)}
.daychip.past{opacity:.6}
.daychip.on.past{opacity:1}
.daychip.closed b{text-decoration:line-through;opacity:.5}

.hoy-head{display:flex;align-items:baseline;gap:10px;padding:6px 16px 8px}
.hoy-head h2{font-size:22px;text-transform:capitalize}
.hoy-head .sub{color:var(--mut);font-size:13px}

/* Resumen del día: tiras de números */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:17px;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.ok b{color:var(--ok)}
.stat.pend b{color:var(--silla)}
.stat .tiny{font-size:11px;color:var(--mut);font-weight:400}
.prox-inline{display:none}
@media (max-width:480px){
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat{padding:7px 8px}
  .stat b{font-size:15px}
  .stat.ok b{font-size:20px}
  .stat.prox{display:none}
  .prox-inline{display:inline}
  .prox-inline b{color:var(--ink);font-size:15px}
}

.quick{display:flex;gap:8px;padding:0 16px 10px}
.quick button{flex:1;height:44px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:transform .1s,background .15s}
.quick button svg{width:18px;height:18px}
.quick button:active{transform:scale(.97)}
.quick button.pri{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 6px 16px rgba(179,48,43,.28)}

.agenda{position:relative;margin:4px 16px 0;padding-left:52px;user-select:none;-webkit-user-select:none}
.agenda .rail{position:absolute;left:0;top:0;width:52px}
.agenda .tick{position:absolute;left:0;width:48px;text-align:right;font-size:12px;color:var(--mut);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.agenda .tick.hour{font-weight:700;color:var(--ink2);font-size:13px}
.agenda .grid{position:relative;border-left:1px solid var(--line2)}
.agenda .line{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.agenda .line.hour{border-top-color:var(--line2)}
.free{position:absolute;left:4px;right:0;border-radius:10px;display:block;text-align:left;color:transparent;transition:background .15s,color .15s;border:1px dashed transparent}
.free:hover,.free:focus-visible{background:var(--card2);border-color:var(--line2);color:var(--mut)}
.free .plus{position:absolute;left:10px;height:var(--slot);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;pointer-events:none}
.free .plus svg{width:16px;height:16px}
.free.past{opacity:.6}
@media (hover:none){.free{color:var(--mut)}.free.past{color:transparent}}   /* en táctil no hay hover: el "+ hora" se ve siempre */

/* Línea de "ahora" */
.now{position:absolute;left:-52px;right:0;height:0;z-index:4;pointer-events:none}
.now .lbl{position:absolute;left:0;top:-9px;width:48px;padding-right:4px;margin:0;letter-spacing:0;line-height:18px;text-align:right;font-size:11px;font-weight:700;color:var(--red);background:var(--bg);border-radius:4px;box-shadow:0 0 0 2px var(--bg);font-variant-numeric:tabular-nums}   /* margin y letter-spacing anulan lo que filtra .lbl; el fondo tapa el tick de la media hora */
.now .bar{position:absolute;left:52px;right:0;top:0;border-top:2px solid var(--red);box-shadow:0 0 8px rgba(212,70,63,.5)}
.now .dot{position:absolute;left:47px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 2s infinite}

/* Tarjeta de turno */
.turno{position:absolute;left:4px;display:flex;align-items:center;gap:8px;padding:0 6px 0 2px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s,opacity .2s,background .2s;animation:popIn .3s cubic-bezier(.2,.8,.2,1) backwards;z-index:2;overflow:hidden}
.turno:hover{box-shadow:var(--shadow-lg);z-index:3}
.turno.drag{z-index:10;box-shadow:var(--shadow-lg);transform:scale(1.02);opacity:.95;transition:none;cursor:grabbing}
.turno .grip{flex:none;width:28px;height:100%;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:grab;touch-action:none;border-radius:8px}
.turno .grip:hover{color:var(--ink2);background:var(--card2)}
.turno .grip svg{width:14px;height:14px}
.turno .body{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:100%;cursor:pointer;text-align:left;padding:2px 0}
.turno .av{flex:none}
.turno .tx{min-width:0;flex:1}
.turno .nm{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
.turno .nm .n{min-width:0;overflow:hidden;text-overflow:ellipsis}
.turno .nm .tag{flex:none}
.turno .sv{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turno .sv b{color:var(--ink2);font-weight:600}
.turno .hora{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;margin-right:4px}
.turno .act{flex:none;height:44px;min-width:84px;padding:0 10px;border-radius:10px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:transform .1s,background .15s;white-space:nowrap}
.turno .act svg{width:15px;height:15px}
.turno .act:active{transform:scale(.95)}
.turno .more{flex:none;width:30px;height:40px;border-radius:8px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.turno .more:hover{background:var(--card2);color:var(--ink)}
.turno .more svg{width:18px;height:18px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;letter-spacing:.02em;vertical-align:middle;line-height:1.5}
.tag svg{width:10px;height:10px}
.tag.online{background:var(--online-bg);color:var(--online)}
.tag.warn{background:var(--red-bg);color:var(--red)}
html[data-theme=dark] .tag.warn,html[data-theme=dark] .hint.warn{color:#f08a82}   /* rojo más claro sobre --red-bg oscuro: a 10px hace falta 4,5:1 */
.tag.prod{background:var(--gold-bg);color:var(--gold)}
.tag.tip{background:var(--ok-bg);color:var(--ok)}
/* estados */
.turno.reservado{border-left-color:var(--online)}
.turno.reservado .act{background:var(--online-bg);color:var(--online)}
.turno.confirmado .act{background:var(--card3);color:var(--ink)}
.turno.silla{border-left-color:var(--silla);background:var(--silla-bg)}
.turno.silla .act{background:var(--silla);color:var(--silla-ink)}
.turno.cobrado{border-left-color:var(--ok);background:var(--ok-bg)}
.turno.cobrado .act{background:transparent;color:var(--ok);cursor:default}
.turno.nocame{border-left-color:var(--no);opacity:.7}
.turno.nocame .nm{color:var(--mut)}.turno.nocame .nm .n{text-decoration:line-through}
.turno.nocame .act{background:var(--no-bg);color:var(--mut)}
.turno.late{box-shadow:inset 0 0 0 1px var(--silla)}
.turno.paid-anim{animation:paidPulse .7s ease-out}
.agenda.noanim .turno:not(.paid-anim){animation:none}   /* al refrescar en el lugar, las tarjetas no vuelven a "entrar" */
.turno.compact .sv{display:none}
.turno.narrow .sv{display:none}   /* dos turnos a la misma hora: cada tarjeta tiene la mitad del ancho */
.turno.narrow .act{font-size:0;min-width:40px;padding:0 8px;gap:0}
.turno.narrow .av{display:none}
.turno.compact .nm{font-size:14px}
@media (max-width:600px){
  .turno{gap:6px;padding-right:4px}
  .turno .more{display:none}
  .turno .av{width:32px;height:32px;font-size:12px}
  .turno .act{min-width:78px;padding:0 8px;font-size:12.5px}
  .turno .nm{font-size:14px}
}
.ghost-time{position:absolute;left:4px;transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;z-index:11;pointer-events:none;font-variant-numeric:tabular-nums}

/* Avatar de iniciales */
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;letter-spacing:.02em;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:20px}

/* Panel lateral derecho (escritorio) */
.hoy-grid{display:block}
.aside{display:none}
@media (min-width:900px){
  .hoy-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start;padding:0 24px}
  .hoy-head{padding-left:0;padding-right:0}
  .aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:153px;max-height:calc(100vh - 153px);overflow-y:auto}   /* 153 = 66 top-row + 74 weekstrip + 1 borde + 12 */
  .stats{display:none}
  .quick{display:none}
  .agenda{margin:0 0 20px}
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:10px;font-weight:700}
.panel .big{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
.panel .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.panel .row:first-of-type{border-top:0}
.panel .row b{font-variant-numeric:tabular-nums}
.panel .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .kv div{background:var(--card2);border-radius:10px;padding:8px 10px}
.panel .kv small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.panel .kv b{font-size:16px}
.panel .acts{display:flex;flex-direction:column;gap:8px}
.btn{height:46px;padding:0 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--ink);border:1px solid var(--line);transition:transform .1s,background .15s,box-shadow .15s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:hover{background:var(--card3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 6px 16px rgba(179,48,43,.28)}
.btn.pri:hover{background:var(--red2)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:transparent;border-color:var(--line2)}
.btn.sm{height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn.danger{color:var(--red)}
.next-card{display:flex;align-items:center;gap:12px}
.next-card .tx{flex:1;min-width:0}
.next-card .nm{font-weight:700;font-size:16px}
.next-card .sv{font-size:13px;color:var(--mut)}
.next-card .in{font-size:13px;font-weight:700;color:var(--silla);white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--mut);font-size:14px}
.empty svg{width:40px;height:40px;margin:0 auto 10px;opacity:.5}
.hoy-grid .empty{padding:8px 16px 6px}

/* ---------- 4) Sheet (panel inferior) ---------- */
.sheet-bg{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(10,8,6,.45);z-index:40;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.on{opacity:1;visibility:visible}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:92vh;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet-bg.on .sheet{transform:translateY(0)}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 16px 6px;flex:none}
.sheet .sh h2{font-size:18px;flex:1;min-width:0}
.sheet .sh .sub{font-size:12px;color:var(--mut);display:block;font-weight:400}
.sheet .sc{overflow:auto;padding:4px 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex:none;background:var(--card)}
.sheet .sf .btn{flex:1}
@media (min-width:900px){
  .sheet-bg{align-items:center}
  .sheet{border-radius:22px;max-height:88vh;max-width:640px;transform:translateY(20px) scale(.98)}
  .sheet-bg.on .sheet{transform:none}
  .sheet .handle{display:none}
  .sheet .sh{padding-top:16px}
}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-weight:700;margin:12px 0 6px}
.lbl .r{float:right;text-transform:none;letter-spacing:0;font-weight:600;color:var(--online);cursor:pointer;font-size:12px}
.field{width:100%;height:50px;padding:0 14px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);font-size:17px;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,48,43,.15);outline:none}
textarea.field{height:auto;min-height:72px;padding:10px 14px;resize:vertical;font-size:15px}
.timebar{display:flex;align-items:center;gap:6px}
.timebar .t{flex:1;text-align:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;height:50px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);padding:0;min-width:0}
.timebar .t:focus{border-color:var(--red)}
.timebar button.st{width:46px;height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px;flex:none}
.timebar button.st:active{transform:scale(.95)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px 0 6px;border-radius:22px;background:var(--card2);border:1.5px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;flex:none;transition:background .15s,border-color .15s,transform .1s;color:var(--ink)}
.chip.plain{padding:0 14px;height:40px}
.chip:hover{background:var(--card3)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .av{box-shadow:0 0 0 2px var(--bg)}
.chip small{font-weight:500;color:var(--mut);font-size:12px}
.chip.on small{color:inherit;opacity:.7}
.chip .warn{color:var(--red)}
.hint{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink2);margin-top:8px;min-height:38px;animation:fadeUp .2s both}
.hint b{color:var(--ink)}
.hint.warn{background:var(--red-bg);color:var(--red)}
.hint .av{margin-right:2px}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.svc{height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 6px;transition:background .15s,border-color .15s,transform .1s}
.svc b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.svc small{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.svc:active{transform:scale(.96)}
.svc.on{background:var(--red);border-color:var(--red);color:#fff}
.svc.on small{color:rgba(255,255,255,.85)}
.pricebox{display:flex;align-items:center;gap:10px;margin-top:4px}
.pricebox .money{flex:1;min-width:0;width:0;height:56px;border:1.5px solid var(--line2);border-radius:12px;font-size:30px;font-weight:800;text-align:right;padding:0 14px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:var(--card)}
.pricebox .money:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,48,43,.15)}
.pricebox .sug{font-size:12px;color:var(--mut);width:88px;line-height:1.25;cursor:pointer;user-select:none}
.pricebox .sug b{display:block;color:var(--ink);font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad button{height:50px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:600;transition:background .1s,transform .1s;font-variant-numeric:tabular-nums}
.keypad button:active{transform:scale(.95);background:var(--card3)}
.keypad button.fn{font-size:16px;color:var(--mut)}
.keypad button.fn svg{width:22px;height:22px;margin:0 auto}
.keypad.hide{display:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s;font-size:14px}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.silla{background:var(--silla);border-color:var(--silla);color:var(--silla-ink)}
.seg button.on.no{background:var(--no);border-color:var(--no);color:#17161a}
.seg button.on.online{background:var(--online);border-color:var(--online);color:#fff}
html[data-theme=dark] .seg button.on.ok,html[data-theme=dark] .seg button.on.online,html[data-theme=dark] .btn.ok{color:#0e0e11}   /* en oscuro --ok y --online son claros: tinta oscura */
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%}
.extras{display:flex;gap:8px;flex-wrap:wrap}
.extras .chip.plain{height:40px}
.extras .chip.sold{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.extras .chip.sold .x{margin-left:2px;opacity:.7}
.extras .chip.tipon{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.menu{padding:4px 0}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 8px;border-radius:12px;font-weight:600;font-size:15px;text-align:left;transition:background .1s}
.menu button:hover{background:var(--card2)}
.menu button svg{width:20px;height:20px;flex:none}
.menu button .ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--card2)}
.menu button.c-online .ic{background:var(--online-bg);color:var(--online)}
.menu button.c-silla .ic{background:var(--silla-bg);color:var(--silla)}
.menu button.c-ok .ic{background:var(--ok-bg);color:var(--ok)}
.menu button.c-no .ic{background:var(--no-bg);color:var(--no)}
.menu button.c-red{color:var(--red)}
.menu button.c-red .ic{background:var(--red-bg);color:var(--red)}
.menu .sep{height:1px;background:var(--line);margin:6px 0}


/* ---------- 5) Clientes ---------- */
.vhead{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex-wrap:wrap}
.vhead h2{font-size:22px;flex:1;min-width:0}
.vhead .sub{display:block;font-size:13px;color:var(--mut);font-weight:400}
.search{position:relative;margin:0 16px 10px}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--mut);pointer-events:none}
.search .field{padding-left:42px;height:48px;font-size:16px}
.sorts{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sorts::-webkit-scrollbar{display:none}
.sorts button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;transition:background .15s}
.sorts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sorts button .n{opacity:.6;margin-left:4px;font-weight:500}
.clist{padding:0 16px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.clist{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (min-width:1200px){.clist{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}}
.cli{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%;min-width:0;transition:transform .15s,box-shadow .15s;animation:popIn .25s backwards;min-height:66px;overflow:hidden}
.cli:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cli .tx{flex:1;min-width:0}
.cli .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.2}
.cli .sv{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .st{flex:0 0 auto;width:104px;text-align:right;font-size:12px;font-weight:700;line-height:1.2}
.cli .st small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.cli .st.ok{color:var(--ok)}.cli .st.due{color:var(--silla)}.cli .st.late{color:var(--red)}.cli .st.nuevo{color:var(--online)}
.cli .ring{width:6px;height:38px;border-radius:3px;background:var(--line);overflow:hidden;position:relative;flex:none}
.cli .ring i{position:absolute;bottom:0;left:0;right:0;background:var(--ok);border-radius:3px}
.cli .ring.due i{background:var(--silla)}.cli .ring.late i{background:var(--red)}
.gauge{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;margin:8px 0 4px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge.due i{background:var(--silla)}.gauge.late i{background:var(--red)}
.gauge .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.5}
.ficha-head{display:flex;align-items:center;gap:14px;padding:4px 0 6px}
.ficha-head .tx{flex:1;min-width:0}
.ficha-head h2{font-size:22px}
.ficha-head .sub{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.kpis div{background:var(--card2);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.kpis b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.timeline{position:relative;padding-left:22px;margin-top:6px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl{position:relative;display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.tl::before{content:"";position:absolute;left:-19px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--card)}
.tl.nocame::before{background:var(--no)}
.tl.future::before{background:var(--online)}
.tl.prod::before{background:var(--gold)}
.tl .d{width:92px;color:var(--mut);font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.tl .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .p{font-weight:700;font-variant-numeric:tabular-nums}
.tl .pay{font-size:11px;color:var(--mut);margin-left:4px}
.wa{display:inline-flex;align-items:center;gap:6px;color:#fff;background:#25a05a;border-color:#25a05a}
.wa:hover{background:#1f8c4e}
.actions-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions-row .btn{flex:1;min-width:120px}

/* ---------- 6) Semana ---------- */
.week-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 12px}
@media (max-width:520px){.week-sum{grid-template-columns:1fr 1fr}}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;padding:0 16px 16px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.wday{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:200px;display:flex;flex-direction:column;scroll-snap-align:start;min-width:150px;overflow:hidden}
.wday.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.wday .dh{padding:10px 10px 6px;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .15s}
.wday .dh:hover{background:var(--card2)}
.wday .dh small{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);display:block}
.wday .dh b{font-size:17px}
.wday .dh .tot{display:block;font-size:14px;font-weight:700;color:var(--ok);margin-top:2px;font-variant-numeric:tabular-nums}
.wday .dh .tot.zero{color:var(--mut);font-weight:500}
.wday .bar{height:4px;background:var(--line);margin:0 10px;border-radius:2px;overflow:hidden}
.wday .bar i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:8px 10px 4px}
.heat i{height:8px;border-radius:2px;background:var(--line)}
.heat i.h1{background:#efc9c4}.heat i.h2{background:#e2918a}.heat i.h3{background:var(--red)}
html[data-theme=dark] .heat i.h1{background:#4a2a28}html[data-theme=dark] .heat i.h2{background:#8c3a34}
.heat-lbl{display:flex;justify-content:space-between;font-size:9px;color:var(--mut);padding:0 10px 6px}
.wlist{padding:4px 6px 8px;display:flex;flex-direction:column;gap:3px;flex:1}
.wt{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;border-radius:8px;font-size:12.5px;text-align:left;width:100%;border-left:3px solid var(--line2);background:var(--card2);transition:background .1s}
.wt:hover{background:var(--card3)}
.wt .h{font-variant-numeric:tabular-nums;color:var(--mut);width:36px;flex:none;font-size:11.5px}
.wt .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wt .p{font-variant-numeric:tabular-nums;color:var(--mut);font-size:11.5px}
.wt.cobrado{border-left-color:var(--ok)}.wt.silla{border-left-color:var(--silla)}.wt.reservado{border-left-color:var(--online)}.wt.nocame{border-left-color:var(--no);opacity:.6}
.wt.nocame .n{text-decoration:line-through}
.wday .wfree{text-align:center;font-size:12px;color:var(--mut);padding:6px}
.wday .add{height:36px;border-radius:8px;color:var(--mut);font-size:13px;font-weight:600;border:1px dashed var(--line2);margin:4px 6px 8px}
.wday .add:hover{background:var(--card2);color:var(--ink)}

/* ---------- 7) Caja ---------- */
.caja-grid{display:grid;grid-template-columns:1fr;gap:12px;padding:0 16px 16px}
@media (min-width:900px){.caja-grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--online)}
.bal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bal div{background:var(--card2);border-radius:12px;padding:10px 12px;min-width:0}
.bal small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.bal b{display:block;font-size:20px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bal .in b{color:var(--ok)}.bal .out b{color:var(--red)}
.hbar{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.hbar .l{width:110px;flex:none;color:var(--ink2)}
.hbar .b{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:5px;background:var(--ok);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hbar .b i.tr{background:var(--online)}.hbar .b i.gold{background:var(--gold)}.hbar .b i.red{background:var(--red)}
.hbar .v{width:92px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.li .ic svg{width:18px;height:18px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{color:var(--mut);font-size:12px}
.li .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .v.out{color:var(--red)}
.li .del{width:36px;height:36px;border-radius:10px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;flex:none}
.li .del:hover{background:var(--red-bg);color:var(--red)}
.li .del svg{width:16px;height:16px}
.chart{width:100%;height:auto;margin-top:6px}
.chart text{font-family:var(--font);fill:var(--mut);font-size:11px}
.chart .axis{stroke:var(--line2)}
.chart .bar-now{fill:var(--red)}
.chart .bar-prev{fill:var(--line2)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.delta{font-weight:700;font-size:13px}.delta.up{color:var(--ok)}.delta.down{color:var(--red)}
.recent{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ---------- 8) Productos ---------- */
.pgrid{display:grid;grid-template-columns:1fr;gap:10px;padding:0 16px 16px}
@media (min-width:600px){.pgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.pgrid{grid-template-columns:1fr 1fr 1fr}}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;animation:popIn .25s both;position:relative}
.prod.low{border-color:var(--silla)}
.prod.out{border-color:var(--red)}
.prod .ph{display:flex;align-items:flex-start;gap:10px}
.prod .ph .tx{flex:1;min-width:0}
.prod .nm{font-weight:700;font-size:16px;display:block}
.prod .pr{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.prod .stock{text-align:right;flex:none}
.prod .stock b{font-size:28px;line-height:1;letter-spacing:-.02em;display:block;font-variant-numeric:tabular-nums}
.prod .stock small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.prod .lvl{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prod .lvl i{display:block;height:100%;border-radius:4px;background:var(--ok);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prod.low .lvl i{background:var(--silla)}
.prod.out .lvl i{background:var(--red)}
.prod .alert{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--silla);animation:fadeUp .3s both}
.prod.out .alert{color:var(--red)}
.prod .alert svg{width:14px;height:14px}
.prod .pa{display:flex;gap:6px;margin-top:2px}
.prod .pa .btn{flex:1;height:42px;font-size:13px}
.prod .pa .btn.rep{flex:0 0 auto;min-width:64px}
.prod .edit{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:8px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.prod .edit:hover{background:var(--card2);color:var(--ink)}
.prod .edit svg{width:16px;height:16px}

/* ---------- 9) Toast, confeti, animaciones ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;z-index:60;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;width:calc(100% - 32px);max-width:480px;pointer-events:none}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:34px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.14);color:inherit;font-weight:700;font-size:13px;white-space:nowrap}
html[data-theme=dark] .toast button{background:rgba(0,0,0,.14)}
.toast .tx{flex:1;min-width:0}
@media (min-width:900px){.toast{bottom:24px;left:calc(var(--side-w) + (100% - var(--side-w)) / 2)}}
.confetti{position:fixed;left:0;top:0;width:0;height:0;z-index:70;pointer-events:none}
.confetti i{position:absolute;width:8px;height:8px;border-radius:2px;animation:burst .8s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,70,63,.5)}70%{box-shadow:0 0 0 9px rgba(212,70,63,0)}100%{box-shadow:0 0 0 0 rgba(212,70,63,0)}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes paidPulse{0%{box-shadow:0 0 0 0 rgba(42,138,85,.6)}100%{box-shadow:0 0 0 18px rgba(42,138,85,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .3s}
.fade{animation:fadeUp .25s both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hdr-note{font-size:12px;color:var(--mut);padding:0 16px 8px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;background:var(--card2);color:var(--ink2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.online{background:var(--online-bg);color:var(--online)}.pill.silla{background:var(--silla-bg);color:var(--silla)}.pill.red{background:var(--red-bg);color:var(--red)}
.pill svg{width:12px;height:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.setrow:first-child{border-top:0}
/* ajustes finos para celular */
.cli .sv{display:block}
.vhead .ctl{display:flex;align-items:center;gap:6px;flex:none}
@media (max-width:600px){
  .vhead .ctl{flex:1 1 100%}
  .bal b{font-size:16px}
  .bal div{padding:8px 9px}
  .hbar .l{width:92px}
}
.prod .pa .btn.ed{flex:0 0 auto;min-width:44px;padding:0}
.prod .pa .btn.ed svg{width:16px;height:16px}
</style>

<script>
/* =====================================================================
   JS · PARTE 1: DATOS Y ESTADO
   Modelo (db):
     turnos:    [{id, fecha:'AAAA-MM-DD', hora:'HH:MM', dur:30|45|60, nombre, servicio, precio,
                  pago:''|'efectivo'|'transferencia', estado:'reservado'|'confirmado'|'silla'|'cobrado'|'nocame',
                  origen:'local'|'online', propina:0, nota:''}]
     clientes:  { nombre: {tel:'', notas:''} }          (lo demás se deriva de los turnos)
     gastos:    [{id, fecha, concepto, monto}]
     productos: [{id, nombre, precio, stock, min}]
     ventas:    [{id, fecha, hora, prodId, nombre, precio, cant, pago, turnoId, cliente}]
     servicios: [{n, p, dur}]
   ===================================================================== */
'use strict';
var DB_KEY='samurai-v3';
var HORA_INI=10*60, HORA_FIN=20*60;              // grilla visible 10:00–20:00
var SLOT_H=58;                                   // alto en px de 30 minutos (ver --slot en CSS)
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DIAS_C=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MESES_C=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var ESTADOS={reservado:'Reserva online',confirmado:'Confirmado',silla:'En la silla',cobrado:'Cobrado',nocame:'Faltó'};
var AV_COLORS=['#b3302b','#c2552a','#b8933f','#5b8a3c','#2a8a73','#2f7fb8','#4659c9','#7a4fc9','#b23f8f','#a0423f','#3b7f6d','#8a6b2b'];

// ---------- utilidades ----------
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function hoyIso(){return iso(new Date())}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function diffDias(a,b){return Math.round((fromIso(b)-fromIso(a))/864e5)}   // b - a en días
function lunesDe(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function toMin(h){var p=h.split(':');return (+p[0])*60+(+p[1])}
function hm(m){m=Math.max(0,Math.round(m));return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function ahoraMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function money(n){n=Math.round(n||0);var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (n<0?'-':'')+'$'+s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function fechaLarga(f){var d=fromIso(f);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]}
function fechaCorta(f){var d=fromIso(f);return DIAS_C[d.getDay()]+' '+d.getDate()+' '+MESES_C[d.getMonth()]}
function haceDias(n){if(n===0)return 'hoy';if(n===1)return 'ayer';if(n<7)return 'hace '+n+' días';if(n<30)return 'hace '+Math.round(n/7)+' sem';if(n<365)return 'hace '+Math.round(n/30)+' meses';return 'hace más de un año'}
function icon(n,cls){return '<svg class="'+(cls||'')+'" width="1em" height="1em" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}   // tamaño por defecto: sin él, un svg sin regla CSS mide 300×150
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function avColor(n){return AV_COLORS[hashStr(n.toLowerCase())%AV_COLORS.length]}
function iniciales(n){var w=n.replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean);var s=(w[0]||'?').charAt(0);if(w[1])s+=w[1].charAt(0);return s.toUpperCase()}
function avatar(n,cls){return '<span class="av '+(cls||'')+'" style="background:'+avColor(n)+'">'+esc(iniciales(n))+'</span>'}
function byHora(a,b){return toMin(a.hora)-toMin(b.hora)}
function byFechaHora(a,b){return a.fecha===b.fecha?byHora(a,b):(a.fecha<b.fecha?-1:1)}
function vibrar(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function mode(arr){var c={},best=null,bn=0;arr.forEach(function(v){c[v]=(c[v]||0)+1;if(c[v]>bn){bn=c[v];best=v}});return best}

// ---------- estado y persistencia ----------
var db=null, _cli=null;        // _cli: índice de clientes (cache, se invalida al guardar)
var _sinGuardar=false, _loadError=null, _loadRaw=null;   // storage: alert ya mostrado · por qué falló load ('bloqueado'|'corrupto'|'version') · string crudo leído (init lo respalda)
function save(){db.modified=true;_cli=null;try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){avisarSinGuardar()}}
function load(){_loadError=null;_loadRaw=null;var r=null;try{r=localStorage.getItem(DB_KEY)}catch(e){_loadError='bloqueado';return null}
  if(!r)return null;_loadRaw=r;var o=null;try{o=JSON.parse(r)}catch(e){}
  if(o&&o.v===3)return o;_loadError=(o&&typeof o==='object')?'version':'corrupto';return null}
function avisarSinGuardar(){ // localStorage falló: aviso fijo en el header (sobrevive a openSheet/hideToast) y alert una sola vez por sesión
  var t=$('#topTitle');if(t){t.textContent='No se está guardando';t.style.color='var(--red)';t.style.display='block'}
  if(_sinGuardar)return;_sinGuardar=true;
  alert('Este navegador no deja guardar los datos: lo que cargues se pierde al cerrar la pestaña. Exportá a planilla (Más > Exportar) antes de cerrar y revisá en Chrome que no estén bloqueados los datos de sitios.');
}
function borrarTodo(){db=seedVacio();_cli=null;try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
function turnoById(id){for(var i=0;i<db.turnos.length;i++)if(db.turnos[i].id===id)return db.turnos[i];return null}
function turnosDe(f){return db.turnos.filter(function(t){return t.fecha===f}).sort(byHora)}
function ventasDe(f){return db.ventas.filter(function(v){return v.fecha===f})}

function clientesIndex(){

// Ficha derivada de los turnos: visitas, ritmo, habituales, atraso.
function statsCliente(nombre){
  var ts=(clientesIndex()[nombre]||[]).slice().sort(byFechaHora), hoy=hoyIso();
  var visitas=ts.filter(function(t){return t.estado==='cobrado'||(t.estado==='silla')});
  var faltas=ts.filter(function(t){return t.estado==='nocame'});
  var futuros=ts.filter(function(t){return t.fecha>hoy&&t.estado!=='nocame'});
  var hoyT=ts.filter(function(t){return t.fecha===hoy&&t.estado!=='nocame'&&t.estado!=='cobrado'});
  var pend=ts.filter(function(t){return t.fecha<hoy&&(t.estado==='confirmado'||t.estado==='reservado')});   // pasados sin cobrar ni marcar
  var n=visitas.length, ult=n?visitas[n-1]:null, prim=n?visitas[0]:null;
  var gaps=[];for(var i=Math.max(1,n-6);i<n;i++){var g=diffDias(visitas[i-1].fecha,visitas[i].fecha);if(g>0)gaps.push(g)}
  var ritmo=gaps.length?Math.round(gaps.reduce(function(a,b){return a+b},0)/gaps.length):null;
  var ult5=visitas.slice(-5);
  var pagas=visitas.filter(function(t){return t.precio>0}), precioHab=pagas.length?pagas[pagas.length-1].precio:0, servHab=ult5.length?mode(ult5.map(function(t){return t.servicio})):'', pagoHab=ult5.length?(mode(ult5.map(function(t){return t.pago}).filter(Boolean))||'efectivo'):'efectivo';
  var total=visitas.reduce(function(s,t){return s+t.precio+(t.propina||0)},0);
  var ventas=db.ventas.filter(function(v){return v.cliente===nombre});
  total+=ventas.reduce(function(s,v){return s+v.precio*v.cant},0);
  var desde=ult?diffDias(ult.fecha,hoy):null;
  var atraso=(ritmo&&desde!=null)?desde-ritmo:null;   // >0: ya tendría que haber vuelto
  var ext=db.clientes[nombre]||{};
  var estado='nuevo';
  if(n>=2&&ritmo){ if(atraso>7)estado='late'; else if(atraso>=-3)estado='due'; else estado='ok'; }
  else if(n===1){ estado=desde>45?'late':'ok'; }
  return {nombre:nombre,visitas:visitas,faltas:faltas,futuros:futuros,hoy:hoyT,pendientes:pend,n:n,ultima:ult,primera:prim,ritmo:ritmo,
    precioHab:precioHab,servHab:servHab,pagoHab:pagoHab,total:total,ventas:ventas,desde:desde,atraso:atraso,estado:estado,
    tel:ext.tel||'',notas:ext.notas||'',reincidente:faltas.length>=2,
    proximaSugerida:(ult&&ritmo)?iso(addDays(fromIso(ult.fecha),ritmo)):null};
}
function listaClientes(){return Object.keys(clientesIndex()).map(statsCliente)}
function sugerirClientes(q,max){
  q=(q||'').trim().toLowerCase();
  var l=listaClientes().filter(function(c){return c.n+c.futuros.length+c.hoy.length>0||c.faltas.length||c.pendientes.length});
  if(q)l=l.filter(function(c){return c.nombre.toLowerCase().indexOf(q)>=0});
  l.sort(function(a,b){ // los que "tocan" volver primero, después los más frecuentes y recientes
    var sa=(a.estado==='due'||a.estado==='late'?2:0)+(a.n>=4?1:0), sb=(b.estado==='due'||b.estado==='late'?2:0)+(b.n>=4?1:0);
    if(q){var ia=a.nombre.toLowerCase().indexOf(q)===0?1:0, ib=b.nombre.toLowerCase().indexOf(q)===0?1:0;if(ia!==ib)return ib-ia}
    if(sb!==sa)return sb-sa;
    return (b.ultima?b.ultima.fecha:'')>(a.ultima?a.ultima.fecha:'')?1:-1;
  });
  return l.slice(0,max||8);
}

// ---------- totales ----------
function totalesDia(f){
  var ts=turnosDe(f), vs=ventasDe(f), gs=gastosDe(f);
  var r={cobrado:0,propinas:0,porCobrar:0,cortes:0,efectivo:0,transferencia:0,productos:0,gastos:0,turnos:ts.length,faltas:0};
  ts.forEach(function(t){
    if(t.estado==='cobrado'){r.cobrado+=t.precio;r.propinas+=t.propina||0;r.cortes++;r[t.pago==='transferencia'?'transferencia':'efectivo']+=t.precio+(t.propina||0)}
    else if(t.estado==='nocame')r.faltas++;
    else r.porCobrar+=t.precio;
  });
  vs.forEach(function(v){ // atada a un turno que existe y no está cobrado: no cuenta todavía (al cobrarlo hereda su pago)
    var tv=v.turnoId?turnoById(v.turnoId):null;if(tv&&tv.estado!=='cobrado'){if(tv.estado!=='nocame')r.porCobrar+=v.precio*v.cant;return}   // mientras tanto va a "A cobrar"
    r.productos+=v.precio*v.cant;r[v.pago==='transferencia'?'transferencia':'efectivo']+=v.precio*v.cant});
  gs.forEach(function(g){r.gastos+=g.monto});
  r.ingresos=r.cobrado+r.propinas+r.productos;r.balance=r.ingresos-r.gastos;
  return r;
}
function totalesSemana(lunes){
  var r={cobrado:0,propinas:0,porCobrar:0,cortes:0,efectivo:0,transferencia:0,productos:0,gastos:0,turnos:0,faltas:0,ingresos:0,balance:0,dias:[]};
  for(var i=0;i<7;i++){var f=iso(addDays(lunes,i)),t=totalesDia(f);t.fecha=f;r.dias.push(t);for(var k in t)if(typeof t[k]==='number')r[k]+=t[k]}
  return r;
}
// Ocupación por hora (minutos ocupados por franja de 60') para el mapa de calor
function ocupacionDia(f){
  var h=[];for(var i=0;i<10;i++)h.push(0);
  turnosDe(f).forEach(function(t){if(t.estado==='nocame')return;var a=toMin(t.hora),b=a+(t.dur||30);
    for(var i=0;i<10;i++){var ha=HORA_INI+i*60,hb=ha+60;var ov=Math.min(b,hb)-Math.max(a,ha);if(ov>0)h[i]+=ov}});
  return h;
}

// ---------- exportar a planilla (CSV con ; para Excel en español) ----------
function descargarCSV(nombre,filas){
  var txt='﻿'+filas.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n');
  var blob=new Blob([txt],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=nombre;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);
}
function exportarClientes(){
  var filas=[['Cliente','Visitas','Última visita','Viene cada (días)','Servicio habitual','Precio habitual','Total gastado','Faltas','Teléfono','Notas']];
  listaClientes().sort(function(a,b){return b.n-a.n}).forEach(function(c){filas.push([c.nombre,c.n,c.ultima?c.ultima.fecha:'',c.ritmo||'',c.servHab,c.precioHab,c.total,c.faltas.length,c.tel,c.notas])});

}
function exportarCaja(){
  var filas=[['Fecha','Hora','Tipo','Detalle','Cliente','Monto','Forma de pago','Estado']];
  db.turnos.slice().sort(byFechaHora).forEach(function(t){filas.push([t.fecha,t.hora,'Turno',t.servicio,t.nombre,t.estado==='cobrado'?t.precio+(t.propina||0):0,t.pago,ESTADOS[t.estado]])});
  db.ventas.forEach(function(v){var tv=v.turnoId?turnoById(v.turnoId):null,pend=!!(tv&&tv.estado!=='cobrado');filas.push([v.fecha,v.hora,'Producto',v.nombre+(v.cant>1?' x'+v.cant:''),v.cliente||'',pend?0:v.precio*v.cant,v.pago,pend?(tv.estado==='nocame'?'Faltó':'Sin cobrar'):'Vendido'])});   // mismo criterio que Caja
  db.gastos.forEach(function(g){filas.push([g.fecha,'','Gasto',g.concepto,'',-g.monto,'',''])});
  descargarCSV('samurai-caja-'+hoyIso()+'.csv',filas);

  h+='<div class="panel"><h3>Próximo cliente</h3>'+(prox?'<div class="next-card">'+avatar(prox.nombre,'lg')+'<div class="tx"><div class="nm">'+esc(prox.nombre)+'</div><div class="sv">'+prox.hora+' · '+esc(prox.servicio)+' · '+money(prox.precio)+'</div></div>'+(esHoy&&prox.estado!=='silla'?'<span class="in">'+(toMin(prox.hora)-nowM>0?'en '+(toMin(prox.hora)-nowM)+' min':'ahora')+'</span>':'')+'</div>'
    +'<div class="actions-row" style="margin-top:10px"><button type="button" class="btn sm" data-act="'+prox.id+'">'+(prox.estado==='silla'?icon('cash')+'Cobrar':icon('chair')+'En silla')+'</button><button type="button" class="btn sm ghost" data-open="'+prox.id+'">Ver</button></div>':'<div class="mut" style="font-size:14px">No queda nadie pendiente.</div>')+'</div>';
  h+='<div class="panel"><div class="acts"><button type="button" class="btn pri" id="aNuevo">'+icon('plus')+'Nuevo turno</button><button type="button" class="btn" id="aLlego">'+icon('walk')+'Llegó sin turno</button></div></div>';
  var onl=ts.filter(function(t){return t.estado==='reservado'});
  if(onl.length)h+='<div class="panel"><h3>Reservas online</h3>'+onl.map(function(t){return '<div class="row"><span>'+t.hora+' · '+esc(t.nombre)+'</span><span class="pill online">'+icon('globe')+'web</span></div>'}).join('')+'</div>';
  h+='</div></div>';
  var v=$('#v-hoy');v.innerHTML=h;
  // eventos
  var ir=$('#irHoy');if(ir)ir.onclick=function(){ui.fecha=hoyIso();renderHoy()};
  ['qNuevo','aNuevo'].forEach(function(id){var b=$('#'+id);if(b)b.onclick=function(){sheetAlta({fecha:f,hora:sugerirHora(f)})}});
  ['qLlego','aLlego'].forEach(function(id){var b=$('#'+id);if(b)b.onclick=function(){sheetAlta({fecha:hoyIso(),hora:hm(Math.round(ahoraMin()/5)*5),enSilla:true})}});
  $$('.free',v).forEach(function(b){b.onclick=function(e){var a=+b.getAttribute('data-a'),bb=+b.getAttribute('data-b');
    var y=e.clientY-b.getBoundingClientRect().top;var m=ini+Math.floor(((a-ini)/30*SLOT_H+y)/SLOT_H)*30;m=Math.max(a,Math.min(m,bb-30>a?bb-30:a));m=Math.ceil(m/5)*5;sheetAlta({fecha:f,hora:hm(m)})}});
  $$('[data-act]',v).forEach(function(b){b.onclick=function(e){e.stopPropagation();avanzar(b.getAttribute('data-act'),b)}});
  $$('[data-open]',v).forEach(function(b){b.onclick=function(e){if(suppressClick){suppressClick=false;return}sheetAlta({id:b.getAttribute('data-open')})}});
  $$('[data-menu]',v).forEach(function(b){b.onclick=function(e){e.stopPropagation();sheetMenuTurno(b.getAttribute('data-menu'))}});
  bindDrag($('#agenda'),fin);
  animarContadores(v);
  updateNow();
  if(opts.paid){var card=$('.turno[data-id="'+opts.paid+'"]',v);if(card){card.classList.add('paid-anim');var r=$('.act',card).getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2)}}
  if(esHoy&&ts.length&&!ui.scrolledToNow&&!opts.keepScroll){ui.scrolledToNow=true;var nl=$('#nowLine');if(nl&&nl.style.display!=='none'){var y=nl.getBoundingClientRect().top+window.pageYOffset-220;if(y>0)window.scrollTo(0,y)}}
}
function sugerirHora(f){ // primer hueco libre desde ahora (si es hoy) o desde las 10:00
  var ts=turnosDe(f),m=f===hoyIso()?Math.max(HORA_INI,Math.ceil(ahoraMin()/30)*30):HORA_INI;
  for(var k=0;k<40;k++){var ok=true;for(var i=0;i<ts.length;i++){var a=toMin(ts[i].hora),b=a+(ts[i].dur||30);if(m<b&&m+30>a){ok=false;break}}if(ok)return hm(m);m+=30}
  return hm(m);
}
function layoutCols(ts){ // turnos que se pisan en el tiempo van en columnas lado a lado
  var cols=[],info={},clusterEnd=-1,cluster=[];
  function flush(){cluster.forEach(function(t){info[t.id].n=cols.length});cols=[];cluster=[]}
  ts.forEach(function(t){var a=toMin(t.hora),b=a+(t.dur||30);if(a>=clusterEnd)flush();var c=0;while(c<cols.length&&cols[c]>a)c++;cols[c]=b;info[t.id]={c:c,n:1};cluster.push(t);clusterEnd=Math.max(clusterEnd,b)});
  flush();return info;
}
function updateNow(){
  var nl=$('#nowLine');if(!nl)return;
  var esHoy=ui.fecha===hoyIso(),m=ahoraMin(),ag=$('#agenda'),ini=ui.ini,fin=ag?ini+(ag.offsetHeight/SLOT_H)*30:HORA_FIN;
  if(!esHoy||m<ini||m>fin){nl.style.display='none';return}
  nl.style.display='block';nl.style.top=((m-ini)/30*SLOT_H)+'px';$('#nowLbl').textContent=hm(m);
}
setInterval(function(){var h=hoyIso();if(h!==ui.hoy){if(ui.fecha===ui.hoy)ui.fecha=h;ui.hoy=h;ui.scrolledToNow=false;refrescar()}else if(ui.view==='hoy')updateNow()},30000);   // cada 30 s: si cambió el día con la pestaña abierta pasa al día nuevo; si no, mueve la línea de ahora

// ---------- acciones sobre turnos ----------
function avanzar(id,btn){
  var t=turnoById(id);if(!t)return;
  if(t.estado==='reservado'||t.estado==='confirmado'){t.estado='silla';save();vibrar(15);refrescar();toast(esc(t.nombre)+' pasó a la silla')}
  else if(t.estado==='silla')cobrar(id);
  else if(t.estado==='cobrado')sheetMenuTurno(id);
  else if(t.estado==='nocame'){t.estado='confirmado';save();refrescar();toast('Vuelve a estar confirmado')}
}
function cobrar(id,pago){
  var t=turnoById(id);if(!t)return;
  var st=statsCliente(t.nombre);pago=pago||t.pago||st.pagoHab||'efectivo';
  t.estado='cobrado';t.pago=pago;db.ventas.forEach(function(v){if(v.turnoId===id)v.pago=pago});save();vibrar([15,40,15]);   // las ventas del turno siguen su pago
  if(ui.view==='hoy')renderHoy({paid:id,keepScroll:true});else refrescar();
  var otro=pago==='efectivo'?'transferencia':'efectivo';
  toast('Cobrado '+money(t.precio+(t.propina||0))+' · '+pago,{label:'Fue por '+otro,fn:function(){t.pago=otro;db.ventas.forEach(function(v){if(v.turnoId===id)v.pago=otro});save();refrescar();toast('Listo: '+otro)}});
}
function setEstado(id,estado){
  var t=turnoById(id);if(!t)return;
  if(estado==='cobrado'){cobrar(id);return}
  var antes=t.estado,pagoAntes=t.pago;t.estado=estado;if(estado==='nocame')t.pago='';save();refrescar();
  if(estado==='nocame'){var st=statsCliente(t.nombre);toast(esc(t.nombre)+' faltó'+(st.faltas.length>=2?' · ya van '+st.faltas.length:''),{label:'Deshacer',fn:function(){t.estado=antes;t.pago=pagoAntes;save();refrescar()}})}
  else toast(ESTADOS[estado]);
}
function borrarTurno(id){
  var i=db.turnos.map(function(t){return t.id}).indexOf(id);if(i<0)return;
  var t=db.turnos.splice(i,1)[0];var vs=db.ventas.filter(function(v){return v.turnoId===id});
  vs.forEach(function(v){var p=prodById(v.prodId);if(p)p.stock+=v.cant});db.ventas=db.ventas.filter(function(v){return v.turnoId!==id});
  save();refrescar();
  toast('Turno de '+esc(t.nombre)+' borrado',{label:'Deshacer',fn:function(){db.turnos.push(t);vs.forEach(function(v){db.ventas.push(v);var p=prodById(v.prodId);if(p)p.stock-=v.cant});save();refrescar()}});
}
function refrescar(){ // vuelve a pintar la vista activa sin mover el scroll
  if(ui.view==='hoy')renderHoy({keepScroll:true});else if(ui.view==='semana')renderSemana();else if(ui.view==='clientes')renderClientes();else if(ui.view==='caja')renderCaja();else renderProductos();
  renderNav();
}

// ---------- arrastrar y soltar (pointer events: mouse y touch) ----------
var drag=null,suppressClick=false,lpTimer=null,lpFired=false;
function bindDrag(ag,fin){
  if(!ag)return;
  ag.addEventListener('pointerdown',function(e){
    var card=e.target.closest?e.target.closest('.turno'):null;if(!card)return;
    if(e.target.closest('.act')||e.target.closest('.more'))return;
    var onGrip=!!e.target.closest('.grip');
    if(!onGrip&&e.pointerType!=='mouse'){startLongPress(card,e);return}   // touch en el cuerpo: solo mantener presionado
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var t=turnoById(card.getAttribute('data-id'));if(!t)return;
    drag={card:card,t:t,y0:e.clientY+window.pageYOffset,top0:parseFloat(card.style.top),min0:toMin(t.hora),fin:fin,active:onGrip,newMin:toMin(t.hora),ghost:null,id:e.pointerId};
    if(onGrip){e.preventDefault();activarDrag()}else startLongPress(card,e);
  });
  ag.addEventListener('contextmenu',function(e){var card=e.target.closest?e.target.closest('.turno'):null;if(card){e.preventDefault();cancelLongPress();sheetMenuTurno(card.getAttribute('data-id'))}});
}
function activarDrag(){
  cancelLongPress();drag.active=true;drag.card.classList.add('drag');
  var g=document.createElement('div');g.className='ghost-time';g.textContent=hm(drag.min0);g.style.top=drag.top0+'px';drag.card.parentNode.appendChild(g);drag.ghost=g;
  vibrar(10);
}
function startLongPress(card,e){
  cancelLongPress();lpFired=false;var x=e.clientX,y=e.clientY;
  lpTimer=setTimeout(function(){lpFired=true;suppressClick=true;vibrar(25);drag=null;sheetMenuTurno(card.getAttribute('data-id'));setTimeout(function(){suppressClick=false},400)},500);
  var mv=function(ev){if(Math.abs(ev.clientX-x)>8||Math.abs(ev.clientY-y)>8)cancelLongPress()};
  var up=function(){cancelLongPress()};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  lpCleanup=function(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up)};
}
var lpCleanup=null;
function cancelLongPress(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null}if(lpCleanup){lpCleanup();lpCleanup=null}}
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dy=e.clientY+window.pageYOffset-drag.y0;
  if(!drag.active){if(Math.abs(dy)>6)activarDrag();else return}
  e.preventDefault();
  var dur=drag.t.dur||30,m=Math.round((drag.min0+dy/SLOT_H*30)/5)*5;m=Math.max(ui.ini,Math.min(m,Math.max(drag.fin,HORA_FIN)-dur));
  drag.newMin=m;var top=(m-ui.ini)/30*SLOT_H;
  drag.card.style.transform='translateY('+(drag.top0+dy-drag.top0)+'px) scale(1.02)';
  drag.ghost.textContent=hm(m);drag.ghost.style.top=top+'px';
  if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-90)window.scrollBy(0,14);
});
function endDrag(e){
  if(!drag)return;var d=drag;drag=null;cancelLongPress();
  if(!d.active)return;
  d.card.classList.remove('drag');d.card.style.transform='';if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  suppressClick=true;setTimeout(function(){suppressClick=false},300);
  if(d.newMin!==d.min0){var antes=d.t.hora;d.t.hora=hm(d.newMin);save();renderHoy({keepScroll:true});toast(esc(d.t.nombre)+' movido a '+d.t.hora,{label:'Deshacer',fn:function(){d.t.hora=antes;save();refrescar()}})}
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
</script>

<script>
/* =====================================================================
   JS · PARTE 3: SHEETS (panel inferior): alta/edición de turno, menú,
   ficha de cliente, gasto, producto, servicios y ajustes
   ===================================================================== */
var sheetOpen=false,sheetOnClose=null;   // sheetOnClose: closeSheet lo ejecuta una sola vez (vuelta al alta desde "editar precios")
function openSheet(html){
  var s=$('#sheet');s.innerHTML=html;$('#sheetBg').classList.add('on');sheetOpen=true;sheetOnClose=null;hideToast();s.scrollTop=0;var sc=$('.sc',s);if(sc)sc.scrollTop=0;
  $$('[data-close]',s).forEach(function(b){b.onclick=closeSheet});
  var af=$('[data-af]',s);if(af&&window.innerWidth>=900)setTimeout(function(){af.focus()},50);   // en celular no se abre el teclado solo
}
function closeSheet(){if(!sheetOpen)return;$('#sheetBg').classList.remove('on');sheetOpen=false;var f=sheetOnClose;sheetOnClose=null;if(f)f()}
function sheetFrame(title,sub,body,footer){
  return '<div class="handle"></div><div class="sh"><h2>'+title+(sub?'<span class="sub">'+sub+'</span>':'')+'</h2><button type="button" class="ibtn" data-close aria-label="Cerrar">'+icon('x')+'</button></div><div class="sc">'+body+'</div>'+(footer?'<div class="sf">'+footer+'</div>':'');
}
$('#sheetBg').addEventListener('click',function(e){if(e.target.id==='sheetBg')closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
function parseHora(v){var m=/^(\d{1,2})[:.hH ]?(\d{2})$/.exec(String(v).trim());if(!m)return null;var h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return h*60+mi}
function digitsOf(s){return String(s).replace(/\D/g,'')}

// ---------- ALTA / EDICIÓN DE TURNO ----------
// Meta: 3 toques. Tocar un hueco (1) → tocar el nombre sugerido (2) → Guardar (3).
var A=null;
function sheetAlta(o,prev){   // prev: el A que había al salir a "editar precios"; se restaura tal cual (nombre, hora, precio, estado, extras)
  o=o||{};var t=o.id?turnoById(o.id):null,hoy=hoyIso();
  A=prev||(t?{id:t.id,fecha:t.fecha,hora:toMin(t.hora),dur:t.dur||30,nombre:t.nombre,servicio:t.servicio,precio:t.precio,pago:t.pago,estado:t.estado,origen:t.origen,propina:t.propina||0,nota:t.nota||'',fresh:true}
     :{id:null,fecha:o.fecha||ui.fecha,hora:toMin(o.hora||'10:00'),dur:30,nombre:o.nombre||'',servicio:db.servicios[0].n,precio:db.servicios[0].p,pago:'',estado:o.enSilla?'silla':'confirmado',origen:'local',propina:0,nota:'',fresh:true});
  if(!prev){A.ventas=(A.id?db.ventas.filter(function(v){return v.turnoId===A.id}):[]).map(function(v){return {prodId:v.prodId,nombre:v.nombre,precio:v.precio,id:v.id}});A.ventasQuitar=[]}
  var svc=db.servicios.map(function(s,i){return '<button type="button" class="svc" data-svc="'+i+'"><b>'+esc(s.n)+'</b><small>'+money(s.p)+'</small></button>'}).join('');
  var body='<span class="lbl">Horario · '+fechaCorta(A.fecha)+'</span>'
    +'<div class="timebar"><button type="button" class="st" data-dm="-30">−30</button><button type="button" class="st" data-dm="-5">−5</button><input class="t" id="aHora" inputmode="numeric" aria-label="Hora" value="'+hm(A.hora)+'"><button type="button" class="st" data-dm="5">+5</button><button type="button" class="st" data-dm="30">+30</button></div>'
    +'<div class="chips" style="margin-top:8px" id="aDur">'+[30,45,60].map(function(d){return '<button type="button" class="chip plain" data-dur="'+d+'">'+d+' min</button>'}).join('')+'</div>'
    +'<span class="lbl">Cliente</span><input class="field" id="aNombre" placeholder="Nombre o apodo" autocomplete="off" autocapitalize="words" value="'+esc(A.nombre)+'" data-af>'
    +'<div class="chips scroll" id="aSug" style="margin-top:8px"></div><div id="aHint"></div>'
    +'<span class="lbl">Servicio <span class="r" id="aEditSvc">editar precios</span></span><div class="services" id="aSvc">'+svc+'</div>'
    +'<span class="lbl">Precio</span><div class="pricebox"><input class="money num" id="aPrecio" inputmode="none" aria-label="Precio" placeholder="0" value="'+money(A.precio).slice(1)+'"><div class="sug" id="aPrecioSug"></div></div>'
    +'<div class="keypad" id="aPad">'+['1','2','3','4','5','6','7','8','9','000','0','del'].map(function(k){return k==='del'?'<button type="button" class="fn" data-k="del" aria-label="Borrar">'+icon('left')+'</button>':'<button type="button" data-k="'+k+'">'+k+'</button>'}).join('')+'</div>'
    +'<span class="lbl">Pago</span><div class="seg" id="aPago"><button type="button" class="ok" data-p="efectivo">'+icon('cash')+'Efectivo</button><button type="button" class="ok" data-p="transferencia">'+icon('transfer')+'Transferencia</button><button type="button" data-p="">Sin cobrar</button></div>'
    +'<span class="lbl">Estado</span><div class="seg wrap" id="aEstado">'+(A.origen==='online'?'<button type="button" class="online" data-e="reservado">'+icon('globe')+'Reserva</button>':'')+'<button type="button" data-e="confirmado">Confirmado</button><button type="button" class="silla" data-e="silla">'+icon('chair')+'En silla</button><button type="button" class="ok" data-e="cobrado">'+icon('check')+'Cobrado</button><button type="button" class="no" data-e="nocame">'+icon('ghost')+'Faltó</button></div>'
    +'<span class="lbl">Extras (se suman solos al día)</span><div class="extras" id="aExtras"></div>'
    +'<span class="lbl">Nota del turno</span><input class="field" id="aNota" placeholder="Ej.: fade bajo, viene con el hijo" value="'+esc(A.nota)+'">';
  var foot=(A.id?'<button type="button" class="btn ghost danger" id="aBorrar" style="flex:0 0 auto" aria-label="Borrar turno">'+icon('trash')+'</button>':'')+'<button type="button" class="btn pri" id="aGuardar">'+icon('check')+'Guardar turno</button>';
  openSheet(sheetFrame(A.id?'Editar turno':'Nuevo turno',A.id?esc(A.nombre)+' · '+hm(A.hora):'',body,foot));
  var s=$('#sheet');
  // horario
  $$('[data-dm]',s).forEach(function(b){b.onclick=function(){A.hora=Math.max(0,Math.min(23*60+55,A.hora+(+b.getAttribute('data-dm'))));$('#aHora').value=hm(A.hora)}});
  $('#aHora').onchange=function(){var m=parseHora(this.value);if(m==null){this.classList.add('shake');this.value=hm(A.hora);setTimeout(function(){var h=$('#aHora');if(h)h.classList.remove('shake')},300)}else{A.hora=m;this.value=hm(m)}};
  $$('[data-dur]',s).forEach(function(b){b.onclick=function(){A.dur=+b.getAttribute('data-dur');pintarAlta()}});
  // cliente
  var inp=$('#aNombre');inp.oninput=function(){A.nombre=inp.value;pintarSug();pintarHint()};
  // servicios y precio
  $$('[data-svc]',s).forEach(function(b){b.onclick=function(){var sv=db.servicios[+b.getAttribute('data-svc')];A.servicio=sv.n;A.precio=sv.p;if(sv.dur)A.dur=sv.dur;A.fresh=true;pintarAlta()}});
  $('#aEditSvc').onclick=function(){var prev=A,oldP=(db.servicios.filter(function(x){return x.n===prev.servicio})[0]||{}).p;sheetServicios(function(){var sv=db.servicios.filter(function(x){return x.n===prev.servicio})[0];if(!sv&&oldP!=null){sv=db.servicios[0];prev.servicio=sv.n;if(sv.dur)prev.dur=sv.dur}if(sv&&prev.precio===oldP){prev.precio=sv.p;prev.fresh=true}sheetAlta(o,prev)})};   // vuelve con lo tipeado; sigue el precio de lista solo si no lo tocaron
  var pre=$('#aPrecio');
  pre.oninput=function(){A.precio=+digitsOf(pre.value)||0;A.fresh=false;pintarAlta(true)};
  pre.onkeypress=function(e){if(e.key&&e.key.length===1&&!/\d/.test(e.key))e.preventDefault()};   // en PC no entran letras ni comas
  pre.onchange=function(){pintarAlta()};   // al salir del campo se ve el número como lo entendió la app
  pre.onfocus=function(){A.fresh=true;if(window.innerWidth>=900)setTimeout(function(){pre.select()},0)};   // en PC tipear reemplaza, como el teclado
  $$('[data-k]',s).forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-k'),d=(A.fresh&&k!=='del')?'':String(A.precio||'');   // ⌫ con precio fresco borra solo el último dígito
    if(k==='del')d=d.slice(0,-1);else if(d.length<9)d+=k;A.precio=+d||0;A.fresh=false;pintarAlta()}});
  // pago y estado (se mantienen coherentes entre sí)
  $$('[data-p]',s).forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-p');A.pago=p;
    if(p){A.estado='cobrado'}else if(A.estado==='cobrado'){A.estado=(A.fecha===hoy&&A.hora<=ahoraMin())?'silla':'confirmado'}pintarAlta()}});
  $$('[data-e]',s).forEach(function(b){b.onclick=function(){var e=b.getAttribute('data-e');A.estado=e;
    if(e==='cobrado'){if(!A.pago)A.pago=statsCliente(nombreCanonico(A.nombre)).pagoHab||'efectivo'}else A.pago='';pintarAlta()}});
  // guardar / borrar
  $('#aGuardar').onclick=guardarAlta;
  if(A.id)$('#aBorrar').onclick=function(){var id=A.id;closeSheet();borrarTurno(id)};
  $('#aNota').oninput=function(){A.nota=this.value};
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();guardarAlta()}};
  if(!prev&&!A.id&&A.nombre)elegirCliente(A.nombre);else{pintarAlta();pintarSug();pintarHint()}   // desde la ficha: precio y servicio habituales; al volver de "editar precios" no se pisa lo tipeado
}
function pintarAlta(skipPrecio){
  var s=$('#sheet');
  $$('[data-dur]',s).forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-dur')===A.dur)});
  $$('[data-svc]',s).forEach(function(b){b.classList.toggle('on',db.servicios[+b.getAttribute('data-svc')].n===A.servicio)});

function guardarAlta(){
  var t=A.id?turnoById(A.id):null,viejo=t?t.nombre:null,inp=$('#aNombre');
  var n=(A.nombre||'').trim().replace(/\s+/g,' ');
  if(!(viejo&&viejo!==n&&viejo.toLowerCase()===n.toLowerCase()))n=nombreCanonico(n);   // si solo cambian mayúsculas es la misma persona: no se vuelve al nombre viejo
  if(!n){inp.classList.add('shake');inp.focus();setTimeout(function(){inp.classList.remove('shake')},300);return}
  if(!A.precio){var pr=$('#aPrecio');pr.classList.add('shake');pr.focus();setTimeout(function(){pr.classList.remove('shake')},300);return}
  var hm_=parseHora($('#aHora').value);if(hm_!=null)A.hora=hm_;
  if(A.estado==='cobrado'&&!A.pago)A.pago=statsCliente(n).pagoHab||'efectivo';
  var nuevo=!t;
  if(!t){t={id:uid(),origen:A.origen};db.turnos.push(t)}
  t.fecha=A.fecha;t.hora=hm(A.hora);t.dur=A.dur;t.nombre=n;t.servicio=A.servicio;t.precio=A.precio||0;t.pago=A.pago;t.estado=A.estado;t.propina=A.propina||0;t.nota=A.nota||'';
  if(viejo&&viejo!==n){ // cambió el nombre del turno
    if(viejo.toLowerCase()===n.toLowerCase()){ // misma persona, sólo cambian mayúsculas: renombrar en todos lados
      db.turnos.forEach(function(x){if(x.nombre===viejo)x.nombre=n});
      db.ventas.forEach(function(v){if(v.cliente===viejo)v.cliente=n});
      if(db.clientes[viejo]){var c0=db.clientes[n]||(db.clientes[n]={tel:'',notas:''}),o0=db.clientes[viejo];if(!c0.tel)c0.tel=o0.tel||'';if(!c0.notas)c0.notas=o0.notas||'';delete db.clientes[viejo]}
    }else{ // otro nombre: mover sólo lo de este turno; si el viejo queda sin turnos, su tel y notas pasan al nuevo (si estaba vacío)
      db.ventas.forEach(function(v){if(v.turnoId===t.id)v.cliente=n});
      if(!db.turnos.some(function(x){return x.nombre===viejo})&&db.clientes[viejo]){var c1=db.clientes[n]||(db.clientes[n]={tel:'',notas:''}),o1=db.clientes[viejo];if(!c1.tel)c1.tel=o1.tel||'';if(!c1.notas)c1.notas=o1.notas||'';delete db.clientes[viejo]}   // se rescata lo que el nuevo no tenga
    }
  }
  // ventas de productos asociadas al turno
  A.ventasQuitar.forEach(function(id){var v=db.ventas.filter(function(x){return x.id===id})[0];if(v){var p=prodById(v.prodId);if(p)p.stock+=v.cant;db.ventas=db.ventas.filter(function(x){return x.id!==id})}});
  A.ventas.forEach(function(v){if(v.id)return;var p=prodById(v.prodId);if(p)p.stock=Math.max(0,p.stock-1);db.ventas.push({id:uid(),fecha:t.fecha,hora:t.hora,prodId:v.prodId,nombre:v.nombre,precio:v.precio,cant:1,pago:t.pago||'',turnoId:t.id,cliente:n})});
  db.ventas.forEach(function(v){if(v.turnoId===t.id){v.pago=t.pago||'';v.fecha=t.fecha;v.hora=t.hora}});   // las ventas del turno siguen su pago, fecha y hora (sin cobrar no cuentan)
  if(!db.clientes[n])db.clientes[n]={tel:'',notas:''};
  save();closeSheet();
  if(ui.view==='hoy'&&ui.fecha!==t.fecha){ui.fecha=t.fecha}
  if(t.estado==='cobrado'&&nuevo&&ui.view==='hoy')renderHoy({paid:t.id,keepScroll:true});else refrescar();
  toast((nuevo?'Turno anotado':'Turno guardado')+' · '+t.hora+' '+esc(n)+' · '+money(t.precio));
}

function copiar(txt){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);return}}catch(e){}

}
