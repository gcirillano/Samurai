    +'<span class="lbl">Precio de venta</span><input class="field num" id="pPrecio" inputmode="numeric" value="'+(P.precio||'')+'" placeholder="14000">'
    +stepper('stock','Stock actual')+stepper('min','Avisar cuando queden');
  openSheet(sheetFrame(p?'Editar producto':'Nuevo producto','',body,(p?'<button type="button" class="btn ghost danger" id="pDel" style="flex:0 0 auto">'+icon('trash')+'</button>':'')+'<button type="button" class="btn pri" id="pOk">'+icon('check')+'Guardar</button>'));
  $$('#sheet [data-s]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-s');P[k]=Math.max(0,P[k]+(+b.getAttribute('data-d')));$('#sheet [data-f="'+k+'"]').value=P[k]}});
  $$('#sheet [data-f]').forEach(function(i){i.oninput=function(){P[i.getAttribute('data-f')]=Math.max(0,+digitsOf(i.value)||0)}});
  $('#pOk').onclick=function(){var n=$('#pNombre').value.trim();if(!n){$('#pNombre').focus();return}var pr=+digitsOf($('#pPrecio').value)||0;
    if(p){p.nombre=n;p.precio=pr;p.stock=P.stock;p.min=P.min}else db.productos.push({id:uid(),nombre:n,precio:pr,stock:P.stock,min:P.min});
    save();closeSheet();refrescar();toast('Producto guardado')};
  if(p)$('#pDel').onclick=function(){db.productos=db.productos.filter(function(x){return x.id!==id});save();closeSheet();refrescar();toast('Producto borrado',{label:'Deshacer',fn:function(){db.productos.push(p);save();refrescar()}})};
}
function venderProducto(id,pago){
  var p=prodById(id);if(!p||p.stock<=0)return;
  pago=pago||'efectivo';p.stock--;var v={id:uid(),fecha:hoyIso(),hora:hm(ahoraMin()),prodId:p.id,nombre:p.nombre,precio:p.precio,cant:1,pago:pago,turnoId:null,cliente:''};
  db.ventas.push(v);save();refrescar();vibrar(10);
  var otro=pago==='efectivo'?'transferencia':'efectivo';
  toast('Vendido: '+esc(p.nombre)+' '+money(p.precio)+' · '+pago,{label:'Fue por '+otro,fn:function(){v.pago=otro;save();refrescar();toast('Listo: '+otro)}});
}
function reponerProducto(id,n){var p=prodById(id);if(!p)return;p.stock+=n;save();refrescar();toast(esc(p.nombre)+': quedan '+p.stock)}

// ---------- SERVICIOS Y PRECIOS ----------
function sheetServicios(despues){
  var S=db.servicios.map(function(s){return {n:s.n,p:s.p,dur:s.dur||30}});
  function pintar(){
    $('#svcList').innerHTML=S.map(function(s,i){return '<div class="li"><input class="field" style="height:44px;font-size:15px" data-sn="'+i+'" value="'+esc(s.n)+'" placeholder="Servicio"><input class="field num" style="height:44px;width:110px;flex:none;font-size:15px" inputmode="numeric" data-sp="'+i+'" value="'+s.p+'"><button type="button" class="del" data-sd="'+i+'" aria-label="Quitar">'+icon('x')+'</button></div>'}).join('');
    $$('#svcList [data-sn]').forEach(function(i){i.oninput=function(){S[+i.getAttribute('data-sn')].n=i.value}});
    $$('#svcList [data-sp]').forEach(function(i){i.oninput=function(){S[+i.getAttribute('data-sp')].p=+digitsOf(i.value)||0}});
    $$('#svcList [data-sd]').forEach(function(b){b.onclick=function(){S.splice(+b.getAttribute('data-sd'),1);pintar()}});
  }
  openSheet(sheetFrame('Servicios y precios','Se escriben una vez y quedan',"<div class='list' id='svcList'></div><button type='button' class='btn sm ghost full' id='svcAdd' style='margin-top:10px'>"+icon('plus')+"Agregar servicio</button>",'<button type="button" class="btn pri" id="svcOk">'+icon('check')+'Guardar precios</button>'));
  pintar();
  if(despues)sheetOnClose=despues;   // cerrar con X, fondo o Esc también vuelve al alta
  $('#svcAdd').onclick=function(){S.push({n:'',p:0,dur:30});pintar();var l=$$('#svcList [data-sn]');l[l.length-1].focus()};
  $('#svcOk').onclick=function(){db.servicios=S.filter(function(s){return s.n.trim()}).map(function(s){return {n:s.n.trim(),p:s.p,dur:s.dur}});if(!db.servicios.length)db.servicios=[{n:'Corte',p:18000,dur:30}];save();sheetOnClose=null;closeSheet();if(despues)despues();else refrescar();toast('Precios guardados')};
}

// ---------- AJUSTES / MÁS ----------
function sheetMore(){

  var body='<div class="setrow"><span>Tema</span><div class="seg" style="width:230px"><button type="button" data-th="auto"'+(th==='auto'?' class="on"':'')+'>Auto</button><button type="button" data-th="light"'+(th==='light'?' class="on"':'')+'>Claro</button><button type="button" data-th="dark"'+(th==='dark'?' class="on"':'')+'>Oscuro</button></div></div>'

    +'<div class="setrow"><span>Borrar todos los datos<br><small class="mut">Se guardan solo en este navegador. Exportá antes a planilla.</small></span><button type="button" class="btn sm ghost danger" id="mReset">'+icon('reset')+'Borrar todo</button></div>'
    +'<div class="setrow mut" style="font-size:12px">Samurai Barber · gestión interna. Todavía no hay sistema de turnos online conectado: cuando lo haya, las reservas van a entrar solas a la agenda.</div>';
  openSheet(sheetFrame('Ajustes','',body,''));
  $$('#sheet [data-th]').forEach(function(b){b.onclick=function(){setTheme(b.getAttribute('data-th'));$$('#sheet [data-th]').forEach(function(x){x.classList.toggle('on',x===b)})}});

  $('#mExpK').onclick=function(){exportarCaja();toast('Planilla de caja descargada')};

}

<script>
/* =====================================================================
   JS · PARTE 4: vistas Semana, Clientes, Caja, Productos · navegación · inicio
   ===================================================================== */

// ---------- SEMANA (los días lado a lado, como la hoja de Augusto) ----------
function renderSemana(opts){opts=opts||{};
  var lun=ui.semana,hoy=hoyIso(),ts=totalesSemana(lun),prev=totalesSemana(addDays(lun,-7));
  var esta=iso(lun)===iso(lunesDe(new Date())),nd=esta?diffDias(iso(lun),hoy)+1:7;   // esta semana: se compara solo hasta hoy
  var sumF=function(d){return d.cobrado+d.propinas+d.productos};
  var fact=ts.cobrado+ts.propinas+ts.productos,factPrev=prev.dias.slice(0,nd).reduce(function(s,d){return s+sumF(d)},0);
  var diasCon=ts.dias.filter(function(d){return d.cortes>0}).length,delta=(factPrev&&iso(lun)<=iso(lunesDe(new Date())))?Math.round((fact-factPrev)/factPrev*100):null;   // una semana futura no se compara
  var maxTot=1;ts.dias.forEach(function(d){maxTot=Math.max(maxTot,sumF(d))});
  var h='<div class="vhead"><h2>Semana<span class="sub">'+fechaCorta(iso(lun)).slice(4)+' – '+fechaCorta(iso(addDays(lun,6))).slice(4)+(esta?' · esta semana':'')+'</span></h2><div class="ctl"><button type="button" class="ibtn" id="swPrev" aria-label="Semana anterior">'+icon('left')+'</button>'+(esta?'':'<button type="button" class="pill" id="swHoy">Esta semana</button>')+'<button type="button" class="ibtn" id="swNext" aria-label="Semana siguiente">'+icon('right')+'</button></div></div>';
  h+='<div class="week-sum"><div class="stat ok"><small>Facturado</small><b class="num" data-cnt="wfact" data-to="'+fact+'" data-fmt="money">'+money(fact)+'</b></div><div class="stat"><small>Cortes</small><b data-cnt="wcortes" data-to="'+ts.cortes+'">'+ts.cortes+'</b></div><div class="stat"><small>Promedio por día</small><b class="num">'+money(diasCon?fact/diasCon:0)+'</b></div><div class="stat"><small>vs. semana anterior'+(esta&&nd<7?(nd===1?' (mismo día)':' (mismos '+nd+' días)'):'')+'</small><b class="'+(delta==null?'':delta>=0?'delta up':'delta down')+'">'+(delta==null?'—':(delta>=0?'+':'')+delta+'%')+'</b></div></div>';
  h+='<div class="wgrid">';
  for(var i=0;i<7;i++){var d=addDays(lun,i),f=iso(d),tl=turnosDe(f),tot=ts.dias[i],fd=tot.cobrado+tot.propinas+tot.productos,oc=ocupacionDia(f);
    h+='<div class="wday'+(f===hoy?' today':'')+'"><button type="button" class="dh" data-f="'+f+'"><small>'+DIAS[d.getDay()]+'</small><b>'+d.getDate()+' '+MESES_C[d.getMonth()]+'</b><span class="tot'+(fd?'':' zero')+'">'+(fd?money(fd):(tl.length?money(tot.porCobrar)+' a cobrar':'libre'))+'</span></button>';
    h+='<div class="bar"><i style="width:'+Math.round(fd/maxTot*100)+'%"></i></div><div class="heat" title="Ocupación por hora">'+oc.map(function(m){return '<i class="'+(m>=45?'h3':m>=25?'h2':m>0?'h1':'')+'"></i>'}).join('')+'</div><div class="heat-lbl"><span>10h</span><span>15h</span><span>20h</span></div>';
    h+='<div class="wlist">'+tl.map(function(t){return '<button type="button" class="wt '+t.estado+'" data-open="'+t.id+'"><span class="h">'+t.hora+'</span><span class="n">'+esc(t.nombre)+'</span><span class="p">'+(t.estado==='nocame'?'—':money(t.precio).replace('.000','k'))+'</span></button>'}).join('')+(tl.length?'':'<div class="wfree">Sin turnos</div>')+'</div>';
    h+='<button type="button" class="add" data-add="'+f+'">'+icon('plus')+' turno</button></div>';
  }
  h+='</div>';
  var v=$('#v-semana'),g0=$('.wgrid',v),sl=g0?g0.scrollLeft:0;v.innerHTML=h;var g=$('.wgrid',v),td=$('.wday.today',v);g.scrollLeft=(opts.irHoy&&td)?Math.max(0,td.offsetLeft-g.offsetLeft):sl;   // celular: arranca en hoy y al refrescar no salta al lunes
  $('#swPrev').onclick=function(){ui.semana=addDays(ui.semana,-7);renderSemana()};
  $('#swNext').onclick=function(){ui.semana=addDays(ui.semana,7);renderSemana()};
  var sh=$('#swHoy');if(sh)sh.onclick=function(){ui.semana=lunesDe(new Date());renderSemana({irHoy:true})};
  $$('.dh',v).forEach(function(b){b.onclick=function(){ui.fecha=b.getAttribute('data-f');ui.scrolledToNow=false;setView('hoy')}});
  $$('[data-open]',v).forEach(function(b){b.onclick=function(){sheetAlta({id:b.getAttribute('data-open')})}});
  $$('[data-add]',v).forEach(function(b){b.onclick=function(){var f=b.getAttribute('data-add');sheetAlta({fecha:f,hora:sugerirHora(f)})}});
  animarContadores(v);
}

// ---------- CLIENTES ----------
function renderClientes(){
  var all=listaClientes().filter(function(c){return c.n||c.futuros.length||c.hoy.length||c.faltas.length||c.pendientes.length}),q=ui.q.trim().toLowerCase();
  var late=all.filter(function(c){return c.estado==='late'}).length,due=all.filter(function(c){return c.estado==='due'}).length;
  var l=all.filter(function(c){return !q||c.nombre.toLowerCase().indexOf(q)>=0});
  var s=ui.sortCli;
  if(s==='frecuentes')l.sort(function(a,b){if(b.n!==a.n)return b.n-a.n;var fa=a.ultima?a.ultima.fecha:'',fb=b.ultima?b.ultima.fecha:'';return fb>fa?1:fb<fa?-1:0});
  else if(s==='recuperar'){var rank={late:0,due:1,ok:2,nuevo:3};l=l.filter(function(c){return c.n>0});l.sort(function(a,b){return rank[a.estado]-rank[b.estado]||(b.atraso||0)-(a.atraso||0)})}
  else if(s==='recientes')l.sort(function(a,b){var fa=a.ultima?a.ultima.fecha:'',fb=b.ultima?b.ultima.fecha:'';return fb>fa?1:fb<fa?-1:0});
  else l.sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es')});
  var h='<div class="vhead"><h2>Clientes<span class="sub">'+all.length+' fichas armadas solas con los turnos</span></h2><button type="button" class="btn sm ghost" id="cExp">'+icon('down')+'Planilla</button></div>'
    +'<div class="search">'+icon('search')+'<input class="field" id="cQ" placeholder="Buscar por nombre o apodo" value="'+esc(ui.q)+'" autocomplete="off"></div>'
    +'<div class="sorts">'+[['frecuentes','Más frecuentes',''],['recuperar','A recuperar',late+due],['recientes','Recientes',''],['az','A–Z','']].map(function(x){return '<button type="button" data-sort="'+x[0]+'"'+(s===x[0]?' class="on"':'')+'>'+x[1]+(x[2]?'<span class="n">'+x[2]+'</span>':'')+'</button>'}).join('')+'</div>';
  if(s==='recuperar')h+='<div class="hdr-note">'+late+' ya tendrían que haber vuelto · '+due+' les toca estos días. Tocá uno para mandarle un WhatsApp.</div>';
  h+='<div class="clist">'+l.slice(0,120).map(function(c,i){
    var st,sc=c.estado;
    if(c.estado==='nuevo')st='Nuevo<small>'+(c.futuros.length||c.hoy.length?'tiene turno':c.pendientes.length?'turno sin cerrar':'sin visitas')+'</small>';
    else if(c.estado==='late')st='Debería haber vuelto<small>hace '+c.atraso+' días</small>';
    else if(c.estado==='due')st=(c.atraso>0?'Le toca<small>desde hace '+c.atraso+' d</small>':'Le toca<small>'+(c.atraso===0?'hoy':'en '+(-c.atraso)+' días')+'</small>');
    else st='Al día<small>'+(c.ultima?haceDias(c.desde):'')+'</small>';
    var fill=c.ritmo?Math.min(1,c.desde/c.ritmo):0;
    return '<button type="button" class="cli" data-n="'+esc(c.nombre)+'" style="animation-delay:'+Math.min(i*20,300)+'ms">'+avatar(c.nombre)+'<span class="tx"><span class="nm">'+esc(c.nombre)+(c.reincidente?'<span class="tag warn">'+icon('warn')+c.faltas.length+' faltas</span>':'')+(c.futuros.length?'<span class="tag online">turno '+fechaCorta(c.futuros[0].fecha)+'</span>':'')+'</span><span class="sv">'+(c.n?c.n+' visita'+(c.n===1?'':'s')+(c.ritmo?' · cada ~'+c.ritmo+' d':'')+' · '+esc(c.servHab)+' '+money(c.precioHab):'Sin visitas todavía')+'</span></span><span class="st '+sc+'">'+st+'</span><span class="ring '+sc+'"><i style="height:'+Math.round(fill*100)+'%"></i></span></button>'}).join('')+(l.length>120?'<div class="mut" style="grid-column:1/-1;padding:10px 0;text-align:center;font-size:13px">Se muestran 120 de '+l.length+' · buscá por nombre para ver el resto</div>':'')+'</div>'+(l.length?'':'<div class="empty">'+icon('clientes')+(q?'No hay nadie con ese nombre.':s==='recuperar'?'Nadie para recuperar: están todos al día.':'Todavía no hay clientes. Con el primer turno se arma la ficha sola.')+'</div>');
  var v=$('#v-clientes');v.innerHTML=h;
  var inp=$('#cQ');inp.oninput=function(){ui.q=inp.value;var pos=inp.selectionStart;renderClientes();var i2=$('#cQ');i2.focus();try{i2.setSelectionRange(pos,pos)}catch(e){}};
  $$('[data-sort]',v).forEach(function(b){b.onclick=function(){ui.sortCli=b.getAttribute('data-sort');renderClientes()}});
  $$('.cli',v).forEach(function(b){b.onclick=function(){sheetFicha(b.getAttribute('data-n'))}});
  $('#cExp').onclick=function(){exportarClientes();toast('Planilla de clientes descargada')};
}

// ---------- CAJA ----------
function renderCaja(){
  var hoy=hoyIso(),dia=ui.cajaPeriodo==='dia';
  var lun=ui.semana,T=dia?totalesDia(hoy):totalesSemana(lun),P=dia?totalesDia(iso(addDays(new Date(),-7))):totalesSemana(addDays(lun,-7));
  var estaSem=!dia&&iso(lun)===iso(lunesDe(new Date())),nd=estaSem?diffDias(iso(lun),hoy)+1:7;   // esta semana: se compara solo hasta hoy
  var ingresos=T.cobrado+T.propinas+T.productos,ingPrev=dia?P.cobrado+P.propinas+P.productos:P.dias.slice(0,nd).reduce(function(s,d){return s+d.cobrado+d.propinas+d.productos},0),delta=(ingPrev&&(dia||iso(lun)<=iso(lunesDe(new Date()))))?Math.round((ingresos-ingPrev)/ingPrev*100):null;
  var desde=dia?hoy:iso(lun),hasta=dia?hoy:iso(addDays(lun,6));
  var gastos=db.gastos.filter(function(g){return g.fecha>=desde&&g.fecha<=hasta}).sort(function(a,b){return a.fecha<b.fecha?1:-1});
  var ventas=db.ventas.filter(function(v){return v.fecha>=desde&&v.fecha<=hasta}).sort(function(a,b){return (a.fecha+a.hora)<(b.fecha+b.hora)?1:-1});
  var maxPay=Math.max(1,T.efectivo,T.transferencia);
  var h='<div class="vhead"><h2>Caja<span class="sub">'+(dia?fechaLarga(hoy):'semana '+fechaCorta(iso(lun)).slice(4)+' – '+fechaCorta(iso(addDays(lun,6))).slice(4))+'</span></h2>'
    +'<div class="ctl"><div class="seg" style="width:170px"><button type="button" data-per="dia"'+(dia?' class="on"':'')+'>Hoy</button><button type="button" data-per="semana"'+(!dia?' class="on"':'')+'>Semana</button></div>'
    +(dia?'':'<button type="button" class="ibtn" id="kPrev" aria-label="Semana anterior">'+icon('left')+'</button><button type="button" class="ibtn" id="kNext" aria-label="Semana siguiente">'+icon('right')+'</button>')+'</div></div>';
  h+='<div class="caja-grid">';
  h+='<div class="card"><h3>Balance'+(delta!=null?'<span class="delta '+(delta>=0?'up':'down')+'" style="margin-left:auto">'+(delta>=0?'+':'')+delta+'% vs. '+(dia?'hace una semana':'semana anterior'+(estaSem&&nd<7?(nd===1?' (mismo día)':' (mismos '+nd+' días)'):''))+'</span>':'')+'</h3><div class="bal"><div class="in"><small>Ingresos</small><b class="num" data-cnt="kin" data-to="'+ingresos+'" data-fmt="money">'+money(ingresos)+'</b></div><div class="out"><small>Gastos</small><b class="num" data-cnt="kout" data-to="'+T.gastos+'" data-fmt="money">'+money(T.gastos)+'</b></div><div><small>Queda</small><b class="num" data-cnt="kbal" data-to="'+(ingresos-T.gastos)+'" data-fmt="money">'+money(ingresos-T.gastos)+'</b></div></div>'
    +'<div class="hbar" style="margin-top:10px"><span class="l">Efectivo</span><span class="b"><i style="width:'+Math.round(T.efectivo/maxPay*100)+'%"></i></span><span class="v">'+money(T.efectivo)+'</span></div>'
    +'<div class="hbar"><span class="l">Transferencia</span><span class="b"><i class="tr" style="width:'+Math.round(T.transferencia/maxPay*100)+'%"></i></span><span class="v">'+money(T.transferencia)+'</span></div>'
    +'<div class="hbar"><span class="l">Cortes</span><span class="b"><i style="width:'+Math.round(T.cobrado/Math.max(1,ingresos)*100)+'%"></i></span><span class="v">'+T.cortes+' · '+money(T.cobrado)+'</span></div>'
    +'<div class="hbar"><span class="l">Productos</span><span class="b"><i class="gold" style="width:'+Math.round(T.productos/Math.max(1,ingresos)*100)+'%"></i></span><span class="v">'+money(T.productos)+'</span></div>'
    +'<div class="hbar"><span class="l">Propinas</span><span class="b"><i class="gold" style="width:'+Math.round(T.propinas/Math.max(1,ingresos)*100)+'%"></i></span><span class="v">'+money(T.propinas)+'</span></div>'
    +(T.porCobrar?'<div class="hbar"><span class="l">Por cobrar</span><span class="b"><i class="red" style="width:'+Math.round(T.porCobrar/Math.max(1,ingresos+T.porCobrar)*100)+'%"></i></span><span class="v" style="color:var(--silla)">'+money(T.porCobrar)+'</span></div>':'')+'</div>';
  // comparación con la semana anterior (SVG a mano)
  var W=dia?totalesSemana(lunesDe(new Date())):T,WP=dia?totalesSemana(addDays(lunesDe(new Date()),-7)):P;
  h+='<div class="card"><h3>Esta semana vs. la anterior, por día</h3>'+chartSemanas(W,WP)+'<div class="legend"><span><i style="background:var(--red)"></i>esta semana</span><span><i style="background:var(--line2)"></i>semana anterior</span></div></div>';
  // gastos
  h+='<div class="card"><h3>Gastos <span class="r"></span><button type="button" class="btn sm" id="kGasto" style="margin-left:auto">'+icon('plus')+'Gasto</button></h3><div class="list">'+(gastos.map(function(g){return '<div class="li"><span class="ic">'+icon('caja')+'</span><span class="tx"><b>'+esc(g.concepto)+'</b><small>'+fechaCorta(g.fecha)+'</small></span><span class="v out">−'+money(g.monto)+'</span><button type="button" class="del" data-gdel="'+g.id+'" aria-label="Borrar gasto">'+icon('trash')+'</button></div>'}).join('')||'<div class="mut" style="padding:6px 0;font-size:14px">Sin gastos '+(dia?'hoy':'esta semana')+'. Tocá "+ Gasto": concepto y monto, nada más.</div>')+'</div></div>';
  // ventas de productos
  h+='<div class="card"><h3>Productos vendidos<span class="r">'+money(T.productos)+'</span></h3><div class="list">'+(ventas.slice(0,12).map(function(v){return '<div class="li"><span class="ic">'+icon('prod')+'</span><span class="tx"><b>'+esc(v.nombre)+(v.cant>1?' ×'+v.cant:'')+'</b><small>'+fechaCorta(v.fecha)+' '+v.hora+(v.cliente?' · '+esc(v.cliente):'')+' · '+(v.pago||'sin cobrar')+'</small></span><span class="v"'+(v.pago?'':' style="opacity:.6"')+'>'+money(v.precio*v.cant)+'</span></div>'}).join('')||'<div class="mut" style="padding:6px 0;font-size:14px">Nada vendido '+(dia?'hoy':'esta semana')+'. Se vende desde el turno o desde Productos.</div>')+'</div>'
    +'<div class="actions-row"><button type="button" class="btn sm ghost" id="kExp">'+icon('down')+'Exportar caja a planilla</button></div></div>';
  h+='</div>';
  var v=$('#v-caja');v.innerHTML=h;
  $$('[data-per]',v).forEach(function(b){b.onclick=function(){ui.cajaPeriodo=b.getAttribute('data-per');renderCaja()}});
  var kp=$('#kPrev');if(kp){kp.onclick=function(){ui.semana=addDays(ui.semana,-7);renderCaja()};$('#kNext').onclick=function(){ui.semana=addDays(ui.semana,7);renderCaja()}}
  $('#kGasto').onclick=sheetGasto;
  $('#kExp').onclick=function(){exportarCaja();toast('Planilla de caja descargada')};
  $$('[data-gdel]',v).forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-gdel'),g=db.gastos.filter(function(x){return x.id===id})[0];db.gastos=db.gastos.filter(function(x){return x.id!==id});save();renderCaja();toast('Gasto borrado',{label:'Deshacer',fn:function(){db.gastos.push(g);save();renderCaja()}})}});
  animarContadores(v);
}
function chartSemanas(W,WP){
  var w=640,hh=210,padL=44,padR=8,padT=14,padB=28,cw=(w-padL-padR)/7,max=1;
  var a=W.dias.map(function(d){return d.cobrado+d.propinas+d.productos}),b=WP.dias.map(function(d){return d.cobrado+d.propinas+d.productos});
  a.concat(b).forEach(function(x){max=Math.max(max,x)});max=Math.ceil(max/50000)*50000||50000;
  var s='<svg class="chart" viewBox="0 0 '+w+' '+hh+'" role="img" aria-label="Facturación por día, esta semana y la anterior">';
  for(var i=0;i<=2;i++){var val=max*i/2,y=padT+(hh-padT-padB)*(1-i/2);s+='<line class="axis" x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y+'" y2="'+y+'" stroke-dasharray="3 4"/><text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end">'+(val>=1000?Math.round(val/1000)+'k':val)+'</text>'}
  for(var d=0;d<7;d++){var x0=padL+d*cw,bw=Math.min(22,cw*.3),gap=4;
    var ha=(hh-padT-padB)*a[d]/max,hb=(hh-padT-padB)*b[d]/max,base=hh-padB;
    s+='<rect class="bar-prev" x="'+(x0+cw/2-bw-gap/2)+'" y="'+(base-hb)+'" width="'+bw+'" height="'+hb+'" rx="3"><title>Semana anterior: '+money(b[d])+'</title></rect>';
    s+='<rect class="bar-now" x="'+(x0+cw/2+gap/2)+'" y="'+(base-ha)+'" width="'+bw+'" height="'+ha+'" rx="3"><title>Esta semana: '+money(a[d])+'</title></rect>';
    s+='<text x="'+(x0+cw/2)+'" y="'+(hh-8)+'" text-anchor="middle">'+DIAS_C[(d+1)%7]+'</text>';
  }
  return s+'</svg>';
}

// ---------- PRODUCTOS ----------
function renderProductos(){
  var ps=db.productos.slice().sort(function(a,b){var la=a.stock<=a.min?0:1,lb=b.stock<=b.min?0:1;return la-lb||a.nombre.localeCompare(b.nombre,'es')});
  var low=ps.filter(function(p){return p.stock<=p.min}).length,hoy=hoyIso();
  var vh=totalesDia(hoy).productos;   // mismo criterio que Caja: lo atado a un turno cuenta recién al cobrar
  var h='<div class="vhead"><h2>Productos<span class="sub">'+(low?low+' por reponer · ':'')+'vendido hoy '+money(vh)+'</span></h2><button type="button" class="btn sm" id="pNuevo">'+icon('plus')+'Producto</button></div>';
  h+='<div class="pgrid">'+ps.map(function(p,i){var cls=p.stock<=0?'out':p.stock<=p.min?'low':'',pct=Math.round(Math.min(1,p.stock/Math.max(1,p.min*3))*100);
    return '<div class="prod '+cls+'" style="animation-delay:'+Math.min(i*30,240)+'ms"><div class="ph"><div class="tx"><span class="nm">'+esc(p.nombre)+'</span><span class="pr">'+money(p.precio)+' · avisar con '+p.min+'</span></div><div class="stock"><b>'+p.stock+'</b><small>en stock</small></div></div>'
      +'<div class="lvl"><i style="width:'+pct+'%"></i></div>'
      +(cls==='out'?'<span class="alert">'+icon('warn')+'Sin stock: hay que reponer</span>':cls==='low'?'<span class="alert">'+icon('warn')+'Se está acabando</span>':'<span class="alert" style="color:var(--mut);font-weight:500">Stock bien</span>')
      +'<div class="pa"><button type="button" class="btn ok" data-sell="'+p.id+'"'+(p.stock<=0?' disabled':'')+'>'+icon('cash')+'Vender</button><button type="button" class="btn rep" data-rep="'+p.id+'" aria-label="Reponer una unidad">'+icon('plus')+'1</button><button type="button" class="btn rep" data-rep5="'+p.id+'" aria-label="Reponer cinco unidades">'+icon('plus')+'5</button>'
      +'<button type="button" class="btn ghost ed" data-pedit="'+p.id+'" aria-label="Editar producto">'+icon('edit')+'</button></div></div>'}).join('')+'</div>'+(ps.length?'':'<div class="empty">'+icon('prod')+'Todavía no cargaste productos. Tocá "+ Producto": nombre, precio y cuántos tenés.</div>');
  var v=$('#v-productos');v.innerHTML=h;
  $('#pNuevo').onclick=function(){sheetProducto()};
  $$('[data-sell]',v).forEach(function(b){b.onclick=function(){venderProducto(b.getAttribute('data-sell'))}});
  $$('[data-rep]',v).forEach(function(b){b.onclick=function(){reponerProducto(b.getAttribute('data-rep'),1)}});
  $$('[data-rep5]',v).forEach(function(b){b.onclick=function(){reponerProducto(b.getAttribute('data-rep5'),5)}});
  $$('[data-pedit]',v).forEach(function(b){b.onclick=function(){sheetProducto(b.getAttribute('data-pedit'))}});
}

// ---------- NAVEGACIÓN, TEMA, INICIO ----------
var VIEWS=[{id:'hoy',l:'Hoy',i:'hoy'},{id:'semana',l:'Semana',i:'semana'},{id:'clientes',l:'Clientes',i:'clientes'},{id:'caja',l:'Caja',i:'caja'},{id:'productos',l:'Productos',i:'prod'}];
function badges(){
  var low=db.productos.filter(function(p){return p.stock<=p.min}).length;
  var onl=turnosDe(hoyIso()).filter(function(t){return t.estado==='reservado'}).length;
  return {productos:low,hoy:onl};
}
function renderNav(){
  var b=badges();
  var mk=function(){return VIEWS.map(function(v){var n=b[v.id]||0;return '<button type="button" data-view="'+v.id+'"'+(ui.view===v.id?' class="on"':'')+' aria-label="'+v.l+'">'+icon(v.i)+'<span>'+v.l+'</span>'+(n?'<span class="badge">'+n+'</span>':'')+'</button>'}).join('')};
  $('#bottomnav').innerHTML=mk();$('#sidenav').innerHTML=mk();
  $$('[data-view]').forEach(function(x){x.onclick=function(){setView(x.getAttribute('data-view'))}});
}
function setView(id){
  ui.view=id;$$('.view').forEach(function(v){v.classList.toggle('on',v.id==='v-'+id)});
  try{history.replaceState(null,'','#'+id)}catch(e){}
  renderNav();
  if(id==='hoy'){window.scrollTo(0,0);ui.scrolledToNow=false;renderHoy()}else{window.scrollTo(0,0);if(id==='semana'){ui.semana=lunesDe(fromIso(ui.fecha));renderSemana({irHoy:true})}else if(id==='clientes')renderClientes();else if(id==='caja')renderCaja();else renderProductos();renderWeekstrip()}
}
function getTheme(){try{return localStorage.getItem('samurai-v2-theme')||'auto'}catch(e){return 'auto'}}
function setTheme(t){
  try{localStorage.setItem('samurai-v2-theme',t)}catch(e){}
  var dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  var ic=dark?'sun':'moon';['themeBtn','themeBtnSide'].forEach(function(id){var b=$('#'+id);if(b){b.innerHTML=icon(ic)+(id==='themeBtnSide'?'<span>'+(dark?'Modo claro':'Modo oscuro')+'</span>':'')}});
}
function toggleTheme(){var dark=document.documentElement.getAttribute('data-theme')==='dark';setTheme(dark?'light':'dark')}
function init(){
  db=load();
  var roto=!db&&(_loadError==='corrupto'||_loadError==='version');   // había algo guardado pero no se pudo leer
  if(!db){if(roto){try{localStorage.setItem(DB_KEY+'-backup-'+hoyIso(),_loadRaw)}catch(e){}}db=seedVacio();try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
  try{localStorage.setItem(DB_KEY+'-test','1');localStorage.removeItem(DB_KEY+'-test')}catch(e){avisarSinGuardar()}   // ¿este navegador deja guardar?
  setTheme(getTheme());
  $('#themeBtn').onclick=toggleTheme;$('#themeBtnSide').onclick=toggleTheme;
  $('#moreBtn').onclick=sheetMore;$('#exportBtn').onclick=sheetMore;
  $('#resetBtnSide').onclick=function(){if(confirm('¿Borrar TODOS los datos de este navegador (turnos, clientes, caja, productos y la lista de servicios y precios)? No se puede deshacer.')){borrarTodo();prevVals={};ui.fecha=hoyIso();refrescar();toast('Datos borrados')}};
  if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addListener(function(){if(getTheme()==='auto')setTheme('auto')})}catch(e){}}
  var hash=(location.hash||'').replace('#','');
  setView(VIEWS.some(function(v){return v.id===hash})?hash:'hoy');
  if(roto)toast('Los datos guardados no se pudieron leer: quedó una copia en este navegador ('+DB_KEY+'-backup-'+hoyIso()+')');
}
init();
</script>
