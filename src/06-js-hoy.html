<script>
/* =====================================================================
   JS · PARTE 2: VISTA HOY (agenda), acciones sobre turnos, arrastrar y soltar
   ===================================================================== */
var ui={view:'hoy',fecha:hoyIso(),hoy:hoyIso(),sortCli:'frecuentes',q:'',cajaPeriodo:'semana',semana:lunesDe(new Date()),scrolledToNow:false,ini:HORA_INI};   // hoy: día real (para el cambio de día) · ini: inicio de la grilla pintada
var prevVals={};   // valores anteriores de los contadores (para animar de un número al otro)

// ---------- toast, confeti, contadores ----------
var toastT=null;
function toast(msg,action){
  var el=$('#toast');
  el.innerHTML='<span class="tx">'+msg+'</span>'+(action?'<button type="button">'+esc(action.label)+'</button>':'');
  if(action)$('button',el).onclick=function(){hideToast();action.fn()};
  el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(hideToast,action?6000:2600);
}
function hideToast(){$('#toast').classList.remove('on')}
function confetti(x,y){
  var c=$('#confetti'),cols=['#b3302b','#c9a24d','#2a8a55','#4659c9','#e2493f','#f0b34a'];
  for(var i=0;i<22;i++){var s=document.createElement('i'),ang=Math.random()*Math.PI*2,d=46+Math.random()*80;
    s.style.left=x+'px';s.style.top=y+'px';s.style.background=cols[i%cols.length];s.style.width=s.style.height=(5+Math.random()*5)+'px';
    s.style.setProperty('--dx',Math.cos(ang)*d+'px');s.style.setProperty('--dy',(Math.sin(ang)*d-50)+'px');
    c.appendChild(s);(function(s){setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},900)})(s)}
}
function animarContadores(root){
  $$('[data-cnt]',root||document).forEach(function(el){
    var key=el.getAttribute('data-cnt'),to=+el.getAttribute('data-to'),fmt=el.getAttribute('data-fmt'),from=prevVals[key]||0;
    prevVals[key]=to; if(from===to){el.textContent=fmt==='money'?money(to):to;return}
    var t0=null;function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/550);p=1-Math.pow(1-p,3);var v=Math.round(from+(to-from)*p);el.textContent=fmt==='money'?money(v):v;if(p<1)requestAnimationFrame(step)}
    requestAnimationFrame(step);
  });
}

// ---------- tira de la semana ----------
function renderWeekstrip(){
  var el=$('#weekstrip');if(ui.view!=='hoy'){el.innerHTML='';return}
  var lun=lunesDe(fromIso(ui.fecha)),hoy=hoyIso(),h='<div class="weekstrip"><button type="button" class="ibtn arrow" id="wsPrev" aria-label="Semana anterior">'+icon('left')+'</button><div class="days">';
  for(var i=0;i<7;i++){var d=addDays(lun,i),f=iso(d),n=turnosDe(f).length;
    h+='<button type="button" class="daychip'+(f===ui.fecha?' on':'')+(f===hoy?' today':'')+(f<hoy?' past':'')+(d.getDay()===0?' closed':'')+'" data-f="'+f+'" aria-label="'+fechaLarga(f)+'"><small>'+DIAS_C[d.getDay()]+'</small><b>'+d.getDate()+'</b><i>'+(n?n+' t':'')+'</i></button>'}
  h+='</div><button type="button" class="ibtn arrow" id="wsNext" aria-label="Semana siguiente">'+icon('right')+'</button></div>';
  el.innerHTML=h;
  $('#wsPrev').onclick=function(){ui.fecha=iso(addDays(fromIso(ui.fecha),-7));renderHoy()};
  $('#wsNext').onclick=function(){ui.fecha=iso(addDays(fromIso(ui.fecha),7));renderHoy()};
  $$('.daychip',el).forEach(function(b){b.onclick=function(){ui.fecha=b.getAttribute('data-f');renderHoy()}});
}

// ---------- vista Hoy ----------
function proximoTurno(f){
  var ts=turnosDe(f),now=f===hoyIso()?ahoraMin():0;
  for(var i=0;i<ts.length;i++){var t=ts[i];if(t.estado==='silla')return t;if((t.estado==='confirmado'||t.estado==='reservado')&&toMin(t.hora)+(t.dur||30)>=now-15)return t}
  return null;
}
function renderHoy(opts){
  opts=opts||{};
  var f=ui.fecha,ts=turnosDe(f),tot=totalesDia(f),esHoy=f===hoyIso(),hoy=hoyIso(),nowM=ahoraMin();
  renderWeekstrip();
  var fin=HORA_FIN,ini=HORA_INI;ts.forEach(function(t){var a=toMin(t.hora);fin=Math.max(fin,a+(t.dur||30));ini=Math.min(ini,a)});fin=Math.ceil(fin/30)*30;ini=Math.floor(ini/30)*30;ui.ini=ini;   // la grilla se estira hacia abajo y hacia arriba
  var slots=(fin-ini)/30,H=slots*SLOT_H;
  var prox=proximoTurno(f),facturado=tot.cobrado+tot.propinas+tot.productos;
  var tit=esHoy?'Hoy':(diffDias(hoy,f)===1?'Mañana':diffDias(hoy,f)===-1?'Ayer':DIAS[fromIso(f).getDay()]);
  var h='<div class="hoy-grid"><div>';
  h+='<div class="hoy-head"><h2>'+tit+'</h2><span class="sub">'+fechaCorta(f).slice(4)+' · '+ts.length+' turno'+(ts.length===1?'':'s')+(tot.faltas?' · '+tot.faltas+' faltó':'')+(prox?'<span class="prox-inline"> · próximo <b>'+esc(prox.nombre)+'</b> '+prox.hora+'</span>':'')+'</span>'+(esHoy?'':'<button type="button" class="pill" id="irHoy" style="margin-left:auto;flex:none">Ir a hoy</button>')+'</div>';
  h+='<div class="stats">'
    +'<div class="stat ok"><small>Facturado</small><b class="num" data-cnt="fact" data-to="'+facturado+'" data-fmt="money">'+money(facturado)+'</b></div>'
    +'<div class="stat pend"><small>A cobrar</small><b class="num" data-cnt="pend" data-to="'+tot.porCobrar+'" data-fmt="money">'+money(tot.porCobrar)+'</b></div>'
    +'<div class="stat"><small>Cortes</small><b><span data-cnt="cortes" data-to="'+tot.cortes+'">'+tot.cortes+'</span><span class="tiny"> / '+(ts.length-tot.faltas)+'</span></b></div>'
    +'<div class="stat prox"><small>Próximo</small><b>'+(prox?esc(prox.nombre)+'<span class="tiny"> '+prox.hora+'</span>':'<span class="tiny">libre</span>')+'</b></div>'
    +'</div>';
  h+='<div class="quick"><button type="button" class="pri" id="qNuevo">'+icon('plus')+'Nuevo turno</button><button type="button" id="qLlego">'+icon('walk')+'Llegó sin turno</button></div>';
  // --- agenda ---
  if(!ts.length)h+='<div class="empty">'+icon('scissors')+'Día libre. Tocá un horario para anotar un turno.</div>';   // arriba de la grilla, donde se ve
  h+='<div class="agenda'+(opts.keepScroll?' noanim':'')+'" id="agenda" style="height:'+H+'px"><div class="rail">';
  for(var m=ini;m<=fin;m+=30){var top=(m-ini)/30*SLOT_H;h+='<span class="tick'+(m%60===0?' hour':'')+'" style="top:'+top+'px">'+hm(m)+'</span>'}
  h+='</div><div class="grid" style="height:'+H+'px">';
  for(var m2=ini;m2<=fin;m2+=30){h+='<div class="line'+(m2%60===0?' hour':'')+'" style="top:'+((m2-ini)/30*SLOT_H)+'px"></div>'}
  // huecos libres (intervalos sin turno)
  var occ=ts.map(function(t){return [toMin(t.hora),toMin(t.hora)+(t.dur||30)]}).sort(function(a,b){return a[0]-b[0]}),cur=ini,libres=[];
  occ.forEach(function(o){if(o[0]>cur)libres.push([cur,o[0]]);cur=Math.max(cur,o[1])});if(cur<fin)libres.push([cur,fin]);
  libres.forEach(function(l){if(l[1]-l[0]<15)return;var top=(l[0]-ini)/30*SLOT_H,hh=(l[1]-l[0])/30*SLOT_H;
    var past=esHoy&&l[1]<=nowM, lbls='';
    for(var mm=Math.ceil(l[0]/30)*30;mm<l[1];mm+=30){if(l[1]-mm<20)break;lbls+='<span class="plus" style="top:'+((mm-l[0])/30*SLOT_H)+'px">'+icon('plus')+hm(Math.max(mm,l[0]))+'</span>'}
    h+='<button type="button" class="free'+(past?' past':'')+'" data-a="'+l[0]+'" data-b="'+l[1]+'" style="top:'+top+'px;height:'+hh+'px" aria-label="Libre de '+hm(l[0])+' a '+hm(l[1])+'">'+lbls+'</button>'});
  // turnos (con columnas cuando se pisan)
  var lay=layoutCols(ts);
  ts.forEach(function(t,i){
    var a=toMin(t.hora),dur=t.dur||30,top=(a-ini)/30*SLOT_H,hh=dur/30*SLOT_H-4,L=lay[t.id];
    var st=statsCliente(t.nombre),late=esHoy&&(t.estado==='confirmado'||t.estado==='reservado')&&a+15<nowM;
    var act;
    if(t.estado==='reservado'||t.estado==='confirmado')act='<button type="button" class="act" data-act="'+t.id+'" aria-label="Pasar a la silla">'+icon('chair')+'En silla</button>';
    else if(t.estado==='silla')act='<button type="button" class="act" data-act="'+t.id+'" aria-label="Cobrar">'+icon('cash')+'Cobrar</button>';
    else if(t.estado==='cobrado')act='<button type="button" class="act" data-act="'+t.id+'" aria-label="Cobrado, ver opciones">'+icon('check')+(t.pago==='transferencia'?'Transf.':'Efectivo')+'</button>';
    else act='<button type="button" class="act" data-act="'+t.id+'" aria-label="Faltó, volver a confirmado">'+icon('ghost')+'Faltó</button>';
    var vent=db.ventas.filter(function(v){return v.turnoId===t.id});
    var tags=(t.origen==='online'?'<span class="tag online">'+icon('globe')+'online</span>':'')+(st.reincidente&&t.estado!=='nocame'?'<span class="tag warn" title="Faltó '+st.faltas.length+' veces">'+icon('warn')+st.faltas.length+' faltas</span>':'');
    var sub='<b>'+money(t.precio)+'</b> · '+esc(t.servicio)+(a%30?' · '+t.hora:'')+(t.propina?' <span class="tag tip">+'+money(t.propina)+'</span>':'')+(vent.length?' <span class="tag prod">+'+vent.length+' prod.</span>':'');
    h+='<div class="turno '+t.estado+(late?' late':'')+(dur<30?' compact':'')+(L.n>1?' narrow':'')+'" data-id="'+t.id+'" style="top:'+top+'px;height:'+hh+'px;left:calc('+(L.c*100/L.n)+'% + 4px);width:calc('+(100/L.n)+'% - 6px);animation-delay:'+Math.min(i*30,300)+'ms">'
      +'<button type="button" class="grip" aria-label="Arrastrar para cambiar el horario">'+icon('grip')+'</button>'
      +'<button type="button" class="body" data-open="'+t.id+'" aria-label="'+esc(t.nombre)+' '+t.hora+', editar">'+avatar(t.nombre)+'<span class="tx"><span class="nm"><span class="n">'+esc(t.nombre)+'</span>'+tags+'</span><span class="sv">'+sub+'</span></span></button>'
      +act+'<button type="button" class="more" data-menu="'+t.id+'" aria-label="Más opciones">'+icon('dots')+'</button></div>';
  });
  h+='<div class="now" id="nowLine" style="display:none"><span class="lbl" id="nowLbl"></span><span class="bar"></span><span class="dot"></span></div>';
  h+='</div></div>';   // grid, agenda
  h+='</div>';         // columna izquierda
  // --- panel lateral (escritorio) ---
  h+='<div class="aside">';
  h+='<div class="panel"><h3>'+(esHoy?'Hoy':fechaCorta(f))+' · resumen</h3><div class="big num" data-cnt="factD" data-to="'+facturado+'" data-fmt="money">'+money(facturado)+'</div><div style="font-size:12px;color:var(--mut);margin:4px 0 10px">facturado'+(tot.propinas?' · incluye '+money(tot.propinas)+' de propinas':'')+'</div>'
    +'<div class="row"><span>Por cobrar</span><b style="color:var(--silla)">'+money(tot.porCobrar)+'</b></div>'
    +'<div class="row"><span>Cortes</span><b>'+tot.cortes+' / '+(ts.length-tot.faltas)+'</b></div>'
    +'<div class="row"><span>Productos</span><b>'+money(tot.productos)+'</b></div>'
    +'<div class="row"><span>Efectivo · Transferencia</span><b>'+money(tot.efectivo)+' · '+money(tot.transferencia)+'</b></div></div>';
  h+='<div class="panel"><h3>Próximo cliente</h3>'+(prox?'<div class="next-card">'+avatar(prox.nombre,'lg')+'<div class="tx"><div class="nm">'+esc(prox.nombre)+'</div><div class="sv">'+prox.hora+' · '+esc(prox.servicio)+' · '+money(prox.precio)+'</div></div>'+(esHoy&&prox.estado!=='silla'?'<span class="in">'+(toMin(prox.hora)-nowM>0?'en '+(toMin(prox.hora)-nowM)+' min':'ahora')+'</span>':'')+'</div>'
    +'<div class="actions-row" style="margin-top:10px"><button type="button" class="btn sm" data-act="'+prox.id+'">'+(prox.estado==='silla'?icon('cash')+'Cobrar':icon('chair')+'En silla')+'</button><button type="button" class="btn sm ghost" data-open="'+prox.id+'">Ver</button></div>':'<div class="mut" style="font-size:14px">No queda nadie pendiente.</div>')+'</div>';
  h+='<div class="panel"><div class="acts"><button type="button" class="btn pri" id="aNuevo">'+icon('plus')+'Nuevo turno</button><button type="button" class="btn" id="aLlego">'+icon('walk')+'Llegó sin turno</button></div></div>';
  var onl=ts.filter(function(t){return t.estado==='reservado'});
  if(onl.length)h+='<div class="panel"><h3>Reservas online</h3>'+onl.map(function(t){return '<div class="row"><span>'+t.hora+' · '+esc(t.nombre)+'</span><span class="pill online">'+icon('globe')+'web</span></div>'}).join('')+'</div>';
  h+='</div></div>';
  var v=$('#v-hoy');v.innerHTML=h;
  // eventos
  var ir=$('#irHoy');if(ir)ir.onclick=function(){ui.fecha=hoyIso();renderHoy()};
  ['qNuevo','aNuevo'].forEach(function(id){var b=$('#'+id);if(b)b.onclick=function(){sheetAlta({fecha:f,hora:sugerirHora(f)})}});
  ['qLlego','aLlego'].forEach(function(id){var b=$('#'+id);if(b)b.onclick=function(){sheetAlta({fecha:hoyIso(),hora:hm(Math.round(ahoraMin()/5)*5),enSilla:true})}});
  $$('.free',v).forEach(function(b){b.onclick=function(e){var a=+b.getAttribute('data-a'),bb=+b.getAttribute('data-b');
    var y=e.clientY-b.getBoundingClientRect().top;var m=ini+Math.floor(((a-ini)/30*SLOT_H+y)/SLOT_H)*30;m=Math.max(a,Math.min(m,bb-30>a?bb-30:a));m=Math.ceil(m/5)*5;sheetAlta({fecha:f,hora:hm(m)})}});
  $$('[data-act]',v).forEach(function(b){b.onclick=function(e){e.stopPropagation();avanzar(b.getAttribute('data-act'),b)}});
  $$('[data-open]',v).forEach(function(b){b.onclick=function(e){if(suppressClick){suppressClick=false;return}sheetAlta({id:b.getAttribute('data-open')})}});
  $$('[data-menu]',v).forEach(function(b){b.onclick=function(e){e.stopPropagation();sheetMenuTurno(b.getAttribute('data-menu'))}});
  bindDrag($('#agenda'),fin);
  animarContadores(v);
  updateNow();
  if(opts.paid){var card=$('.turno[data-id="'+opts.paid+'"]',v);if(card){card.classList.add('paid-anim');var r=$('.act',card).getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2)}}
  if(esHoy&&ts.length&&!ui.scrolledToNow&&!opts.keepScroll){ui.scrolledToNow=true;var nl=$('#nowLine');if(nl&&nl.style.display!=='none'){var y=nl.getBoundingClientRect().top+window.pageYOffset-220;if(y>0)window.scrollTo(0,y)}}
}
function sugerirHora(f){ // primer hueco libre desde ahora (si es hoy) o desde las 10:00
  var ts=turnosDe(f),m=f===hoyIso()?Math.max(HORA_INI,Math.ceil(ahoraMin()/30)*30):HORA_INI;
  for(var k=0;k<40;k++){var ok=true;for(var i=0;i<ts.length;i++){var a=toMin(ts[i].hora),b=a+(ts[i].dur||30);if(m<b&&m+30>a){ok=false;break}}if(ok)return hm(m);m+=30}
  return hm(m);
}
function layoutCols(ts){ // turnos que se pisan en el tiempo van en columnas lado a lado
  var cols=[],info={},clusterEnd=-1,cluster=[];
  function flush(){cluster.forEach(function(t){info[t.id].n=cols.length});cols=[];cluster=[]}
  ts.forEach(function(t){var a=toMin(t.hora),b=a+(t.dur||30);if(a>=clusterEnd)flush();var c=0;while(c<cols.length&&cols[c]>a)c++;cols[c]=b;info[t.id]={c:c,n:1};cluster.push(t);clusterEnd=Math.max(clusterEnd,b)});
  flush();return info;
}
function updateNow(){
  var nl=$('#nowLine');if(!nl)return;
  var esHoy=ui.fecha===hoyIso(),m=ahoraMin(),ag=$('#agenda'),ini=ui.ini,fin=ag?ini+(ag.offsetHeight/SLOT_H)*30:HORA_FIN;
  if(!esHoy||m<ini||m>fin){nl.style.display='none';return}
  nl.style.display='block';nl.style.top=((m-ini)/30*SLOT_H)+'px';$('#nowLbl').textContent=hm(m);
}
setInterval(function(){var h=hoyIso();if(h!==ui.hoy){if(ui.fecha===ui.hoy)ui.fecha=h;ui.hoy=h;ui.scrolledToNow=false;if(ui.view==='hoy'&&ui.fecha===h&&!sheetOpen&&!drag){renderHoy();renderNav()}else refrescar()}else if(ui.view==='hoy')updateNow()},30000);   // cada 30 s: si cambió el día con la pestaña abierta pasa al día nuevo; si no, mueve la línea de ahora

// ---------- acciones sobre turnos ----------
function avanzar(id,btn){
  var t=turnoById(id);if(!t)return;
  if(t.estado==='reservado'||t.estado==='confirmado'){t.estado='silla';save();vibrar(15);refrescar();toast(esc(t.nombre)+' pasó a la silla')}
  else if(t.estado==='silla')cobrar(id);
  else if(t.estado==='cobrado')sheetMenuTurno(id);
  else if(t.estado==='nocame'){t.estado='confirmado';save();refrescar();toast('Vuelve a estar confirmado')}
}
function cobrar(id,pago){
  var t=turnoById(id);if(!t)return;
  var st=statsCliente(t.nombre);pago=pago||t.pago||st.pagoHab||'efectivo';
  t.estado='cobrado';t.pago=pago;db.ventas.forEach(function(v){if(v.turnoId===id)v.pago=pago});save();vibrar([15,40,15]);   // las ventas del turno siguen su pago
  if(ui.view==='hoy')renderHoy({paid:id,keepScroll:true});else refrescar();
  var otro=pago==='efectivo'?'transferencia':'efectivo';
  toast('Cobrado '+money(t.precio+(t.propina||0))+' · '+pago,{label:'Fue por '+otro,fn:function(){t.pago=otro;db.ventas.forEach(function(v){if(v.turnoId===id)v.pago=otro});save();refrescar();toast('Listo: '+otro)}});
}
function setEstado(id,estado){
  var t=turnoById(id);if(!t)return;
  if(estado==='cobrado'){cobrar(id);return}
  var antes=t.estado,pagoAntes=t.pago;t.estado=estado;if(estado==='nocame')t.pago='';save();refrescar();
  if(estado==='nocame'){var st=statsCliente(t.nombre);toast(esc(t.nombre)+' faltó'+(st.faltas.length>=2?' · ya van '+st.faltas.length:''),{label:'Deshacer',fn:function(){t.estado=antes;t.pago=pagoAntes;save();refrescar()}})}
  else toast(ESTADOS[estado]);
}
function borrarTurno(id){
  var i=db.turnos.map(function(t){return t.id}).indexOf(id);if(i<0)return;
  var t=db.turnos.splice(i,1)[0];var vs=db.ventas.filter(function(v){return v.turnoId===id});
  vs.forEach(function(v){var p=prodById(v.prodId);if(p)p.stock+=v.cant});db.ventas=db.ventas.filter(function(v){return v.turnoId!==id});
  save();refrescar();
  toast('Turno de '+esc(t.nombre)+' borrado',{label:'Deshacer',fn:function(){db.turnos.push(t);vs.forEach(function(v){db.ventas.push(v);var p=prodById(v.prodId);if(p)p.stock-=v.cant});save();refrescar()}});
}
function refrescar(){ // vuelve a pintar la vista activa sin mover el scroll
  if(ui.view==='hoy')renderHoy({keepScroll:true});else if(ui.view==='semana')renderSemana();else if(ui.view==='clientes')renderClientes();else if(ui.view==='caja')renderCaja();else renderProductos();
  renderNav();
}

// ---------- arrastrar y soltar (pointer events: mouse y touch) ----------
var drag=null,suppressClick=false,lpTimer=null,lpFired=false;
function bindDrag(ag,fin){
  if(!ag)return;
  ag.addEventListener('pointerdown',function(e){
    var card=e.target.closest?e.target.closest('.turno'):null;if(!card)return;
    if(e.target.closest('.act')||e.target.closest('.more'))return;
    var onGrip=!!e.target.closest('.grip');
    if(!onGrip&&e.pointerType!=='mouse'){startLongPress(card,e);return}   // touch en el cuerpo: solo mantener presionado
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var t=turnoById(card.getAttribute('data-id'));if(!t)return;
    drag={card:card,t:t,y0:e.clientY+window.pageYOffset,top0:parseFloat(card.style.top),min0:toMin(t.hora),fin:fin,active:onGrip,newMin:toMin(t.hora),ghost:null,id:e.pointerId};
    if(onGrip){e.preventDefault();activarDrag()}else startLongPress(card,e);
  });
  ag.addEventListener('contextmenu',function(e){var card=e.target.closest?e.target.closest('.turno'):null;if(card){e.preventDefault();cancelLongPress();sheetMenuTurno(card.getAttribute('data-id'))}});
}
function activarDrag(){
  cancelLongPress();drag.active=true;drag.card.classList.add('drag');
  var g=document.createElement('div');g.className='ghost-time';g.textContent=hm(drag.min0);g.style.top=drag.top0+'px';drag.card.parentNode.appendChild(g);drag.ghost=g;
  vibrar(10);
}
function startLongPress(card,e){
  cancelLongPress();lpFired=false;var x=e.clientX,y=e.clientY;
  lpTimer=setTimeout(function(){lpFired=true;suppressClick=true;vibrar(25);drag=null;sheetMenuTurno(card.getAttribute('data-id'));setTimeout(function(){suppressClick=false},400)},500);
  var mv=function(ev){if(Math.abs(ev.clientX-x)>8||Math.abs(ev.clientY-y)>8)cancelLongPress()};
  var up=function(){cancelLongPress()};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  lpCleanup=function(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up)};
}
var lpCleanup=null;
function cancelLongPress(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null}if(lpCleanup){lpCleanup();lpCleanup=null}}
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dy=e.clientY+window.pageYOffset-drag.y0;
  if(!drag.active){if(Math.abs(dy)>6)activarDrag();else return}
  e.preventDefault();
  var dur=drag.t.dur||30,m=Math.round((drag.min0+dy/SLOT_H*30)/5)*5;m=Math.max(ui.ini,Math.min(m,Math.max(drag.fin,HORA_FIN)-dur));
  drag.newMin=m;var top=(m-ui.ini)/30*SLOT_H;
  drag.card.style.transform='translateY('+(drag.top0+dy-drag.top0)+'px) scale(1.02)';
  drag.ghost.textContent=hm(m);drag.ghost.style.top=top+'px';
  if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-90)window.scrollBy(0,14);
});
function endDrag(e){
  if(!drag)return;var d=drag;drag=null;cancelLongPress();
  if(!d.active)return;
  d.card.classList.remove('drag');d.card.style.transform='';if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  suppressClick=true;setTimeout(function(){suppressClick=false},300);
  if(d.newMin!==d.min0){var antes=d.t.hora;d.t.hora=hm(d.newMin);save();renderHoy({keepScroll:true});toast(esc(d.t.nombre)+' movido a '+d.t.hora,{label:'Deshacer',fn:function(){d.t.hora=antes;save();refrescar()}})}
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
</script>
