<script>
/* =====================================================================
   JS · PARTE 1: DATOS Y ESTADO
   Modelo (db):
     turnos:    [{id, fecha:'AAAA-MM-DD', hora:'HH:MM', dur:30|45|60, nombre, servicio, precio,
                  pago:''|'efectivo'|'transferencia', estado:'reservado'|'confirmado'|'silla'|'cobrado'|'nocame',
                  origen:'local'|'online', propina:0, nota:''}]
     clientes:  { nombre: {tel:'', notas:''} }          (lo demás se deriva de los turnos)
     gastos:    [{id, fecha, concepto, monto}]
     productos: [{id, nombre, precio, stock, min}]
     ventas:    [{id, fecha, hora, prodId, nombre, precio, cant, pago, turnoId, cliente}]
     servicios: [{n, p, dur}]
   ===================================================================== */
'use strict';
var DB_KEY='samurai-v3';
var HORA_INI=10*60, HORA_FIN=20*60;              // grilla visible 10:00–20:00
var SLOT_H=58;                                   // alto en px de 30 minutos (ver --slot en CSS)
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DIAS_C=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MESES_C=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var ESTADOS={reservado:'Reserva online',confirmado:'Confirmado',silla:'En la silla',cobrado:'Cobrado',nocame:'Faltó'};
var AV_COLORS=['#b3302b','#c2552a','#b8933f','#5b8a3c','#2a8a73','#2f7fb8','#4659c9','#7a4fc9','#b23f8f','#a0423f','#3b7f6d','#8a6b2b'];

// ---------- utilidades ----------
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function hoyIso(){return iso(new Date())}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function diffDias(a,b){return Math.round((fromIso(b)-fromIso(a))/864e5)}   // b - a en días
function lunesDe(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function toMin(h){var p=h.split(':');return (+p[0])*60+(+p[1])}
function hm(m){m=Math.max(0,Math.round(m));return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function ahoraMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function money(n){n=Math.round(n||0);var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (n<0?'-':'')+'$'+s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function fechaLarga(f){var d=fromIso(f);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]}
function fechaCorta(f){var d=fromIso(f);return DIAS_C[d.getDay()]+' '+d.getDate()+' '+MESES_C[d.getMonth()]}
function haceDias(n){if(n===0)return 'hoy';if(n===1)return 'ayer';if(n<7)return 'hace '+n+' días';if(n<30)return 'hace '+Math.round(n/7)+' sem';if(n<365)return 'hace '+Math.round(n/30)+' meses';return 'hace más de un año'}
function icon(n,cls){return '<svg class="'+(cls||'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function avColor(n){return AV_COLORS[hashStr(n.toLowerCase())%AV_COLORS.length]}
function iniciales(n){var w=n.replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean);var s=(w[0]||'?').charAt(0);if(w[1])s+=w[1].charAt(0);return s.toUpperCase()}
function avatar(n,cls){return '<span class="av '+(cls||'')+'" style="background:'+avColor(n)+'">'+esc(iniciales(n))+'</span>'}
function byHora(a,b){return toMin(a.hora)-toMin(b.hora)}
function byFechaHora(a,b){return a.fecha===b.fecha?byHora(a,b):(a.fecha<b.fecha?-1:1)}
function vibrar(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function mode(arr){var c={},best=null,bn=0;arr.forEach(function(v){c[v]=(c[v]||0)+1;if(c[v]>bn){bn=c[v];best=v}});return best}

// ---------- estado y persistencia ----------
var db=null, _cli=null;        // _cli: índice de clientes (cache, se invalida al guardar)
function save(){db.modified=true;_cli=null;try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
function load(){try{var r=localStorage.getItem(DB_KEY);if(r){var o=JSON.parse(r);if(o&&o.v===3)return o}}catch(e){}return null}
function borrarTodo(){db=seedVacio();_cli=null;try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
function turnoById(id){for(var i=0;i<db.turnos.length;i++)if(db.turnos[i].id===id)return db.turnos[i];return null}
function turnosDe(f){return db.turnos.filter(function(t){return t.fecha===f}).sort(byHora)}
function ventasDe(f){return db.ventas.filter(function(v){return v.fecha===f})}
function gastosDe(f){return db.gastos.filter(function(g){return g.fecha===f})}
function prodById(id){for(var i=0;i<db.productos.length;i++)if(db.productos[i].id===id)return db.productos[i];return null}
function nombreCanonico(n){ // si ya existe "Tomi", "tomi" se guarda como "Tomi"
  n=n.trim().replace(/\s+/g,' ');var l=n.toLowerCase();
  var ix=clientesIndex();for(var k in ix)if(k.toLowerCase()===l)return k;return n;
}

// ---------- clientes derivados ----------
function clientesIndex(){
  if(_cli)return _cli;
  var m={};
  db.turnos.forEach(function(t){(m[t.nombre]=m[t.nombre]||[]).push(t)});
  _cli=m;return m;
}
// Ficha derivada de los turnos: visitas, ritmo, habituales, atraso.
function statsCliente(nombre){
  var ts=(clientesIndex()[nombre]||[]).slice().sort(byFechaHora), hoy=hoyIso();
  var visitas=ts.filter(function(t){return t.estado==='cobrado'||(t.estado==='silla')});
  var faltas=ts.filter(function(t){return t.estado==='nocame'});
  var futuros=ts.filter(function(t){return t.fecha>hoy&&t.estado!=='nocame'});
  var hoyT=ts.filter(function(t){return t.fecha===hoy&&t.estado!=='nocame'&&t.estado!=='cobrado'});
  var n=visitas.length, ult=n?visitas[n-1]:null, prim=n?visitas[0]:null;
  var gaps=[];for(var i=Math.max(1,n-6);i<n;i++){var g=diffDias(visitas[i-1].fecha,visitas[i].fecha);if(g>0)gaps.push(g)}
  var ritmo=gaps.length?Math.round(gaps.reduce(function(a,b){return a+b},0)/gaps.length):null;
  var ult5=visitas.slice(-5);
  var precioHab=ult?ult.precio:0, servHab=ult5.length?mode(ult5.map(function(t){return t.servicio})):'', pagoHab=ult5.length?(mode(ult5.map(function(t){return t.pago}).filter(Boolean))||'efectivo'):'efectivo';
  var total=visitas.reduce(function(s,t){return s+t.precio+(t.propina||0)},0);
  var ventas=db.ventas.filter(function(v){return v.cliente===nombre});
  total+=ventas.reduce(function(s,v){return s+v.precio*v.cant},0);
  var desde=ult?diffDias(ult.fecha,hoy):null;
  var atraso=(ritmo&&desde!=null)?desde-ritmo:null;   // >0: ya tendría que haber vuelto
  var ext=db.clientes[nombre]||{};
  var estado='nuevo';
  if(n>=2&&ritmo){ if(atraso>7)estado='late'; else if(atraso>=-3)estado='due'; else estado='ok'; }
  else if(n===1){ estado=desde>45?'late':'ok'; }
  return {nombre:nombre,visitas:visitas,faltas:faltas,futuros:futuros,hoy:hoyT,n:n,ultima:ult,primera:prim,ritmo:ritmo,
    precioHab:precioHab,servHab:servHab,pagoHab:pagoHab,total:total,ventas:ventas,desde:desde,atraso:atraso,estado:estado,
    tel:ext.tel||'',notas:ext.notas||'',reincidente:faltas.length>=2,
    proximaSugerida:(ult&&ritmo)?iso(addDays(fromIso(ult.fecha),ritmo)):null};
}
function listaClientes(){return Object.keys(clientesIndex()).map(statsCliente)}
function sugerirClientes(q,max){
  q=(q||'').trim().toLowerCase();
  var l=listaClientes().filter(function(c){return c.n+c.futuros.length+c.hoy.length>0||c.faltas.length});
  if(q)l=l.filter(function(c){return c.nombre.toLowerCase().indexOf(q)>=0});
  l.sort(function(a,b){ // los que "tocan" volver primero, después los más frecuentes y recientes
    var sa=(a.estado==='due'||a.estado==='late'?2:0)+(a.n>=4?1:0), sb=(b.estado==='due'||b.estado==='late'?2:0)+(b.n>=4?1:0);
    if(q){var ia=a.nombre.toLowerCase().indexOf(q)===0?1:0, ib=b.nombre.toLowerCase().indexOf(q)===0?1:0;if(ia!==ib)return ib-ia}
    if(sb!==sa)return sb-sa;
    return (b.ultima?b.ultima.fecha:'')>(a.ultima?a.ultima.fecha:'')?1:-1;
  });
  return l.slice(0,max||8);
}

// ---------- totales ----------
function totalesDia(f){
  var ts=turnosDe(f), vs=ventasDe(f), gs=gastosDe(f);
  var r={cobrado:0,propinas:0,porCobrar:0,cortes:0,efectivo:0,transferencia:0,productos:0,gastos:0,turnos:ts.length,faltas:0};
  ts.forEach(function(t){
    if(t.estado==='cobrado'){r.cobrado+=t.precio;r.propinas+=t.propina||0;r.cortes++;r[t.pago==='transferencia'?'transferencia':'efectivo']+=t.precio+(t.propina||0)}
    else if(t.estado==='nocame')r.faltas++;
    else r.porCobrar+=t.precio;
  });
  vs.forEach(function(v){r.productos+=v.precio*v.cant;r[v.pago==='transferencia'?'transferencia':'efectivo']+=v.precio*v.cant});
  gs.forEach(function(g){r.gastos+=g.monto});
  r.ingresos=r.cobrado+r.propinas+r.productos;r.balance=r.ingresos-r.gastos;
  return r;
}
function totalesSemana(lunes){
  var r={cobrado:0,propinas:0,porCobrar:0,cortes:0,efectivo:0,transferencia:0,productos:0,gastos:0,turnos:0,faltas:0,ingresos:0,balance:0,dias:[]};
  for(var i=0;i<7;i++){var f=iso(addDays(lunes,i)),t=totalesDia(f);t.fecha=f;r.dias.push(t);for(var k in t)if(typeof t[k]==='number')r[k]+=t[k]}
  return r;
}
// Ocupación por hora (minutos ocupados por franja de 60') para el mapa de calor
function ocupacionDia(f){
  var h=[];for(var i=0;i<10;i++)h.push(0);
  turnosDe(f).forEach(function(t){if(t.estado==='nocame')return;var a=toMin(t.hora),b=a+(t.dur||30);
    for(var i=0;i<10;i++){var ha=HORA_INI+i*60,hb=ha+60;var ov=Math.min(b,hb)-Math.max(a,ha);if(ov>0)h[i]+=ov}});
  return h;
}

// ---------- exportar a planilla (CSV con ; para Excel en español) ----------
function descargarCSV(nombre,filas){
  var txt='﻿'+filas.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n');
  var blob=new Blob([txt],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=nombre;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);
}
function exportarClientes(){
  var filas=[['Cliente','Visitas','Última visita','Viene cada (días)','Servicio habitual','Precio habitual','Total gastado','Faltas','Teléfono','Notas']];
  listaClientes().sort(function(a,b){return b.n-a.n}).forEach(function(c){filas.push([c.nombre,c.n,c.ultima?c.ultima.fecha:'',c.ritmo||'',c.servHab,c.precioHab,c.total,c.faltas.length,c.tel,c.notas])});
  descargarCSV('samurai-clientes-'+hoyIso()+'.csv',filas);
}
function exportarCaja(){
  var filas=[['Fecha','Hora','Tipo','Detalle','Cliente','Monto','Forma de pago','Estado']];
  db.turnos.slice().sort(byFechaHora).forEach(function(t){filas.push([t.fecha,t.hora,'Turno',t.servicio,t.nombre,t.precio+(t.propina||0),t.pago,ESTADOS[t.estado]])});
  db.ventas.forEach(function(v){filas.push([v.fecha,v.hora,'Producto',v.nombre+(v.cant>1?' x'+v.cant:''),v.cliente||'',v.precio*v.cant,v.pago,'Vendido'])});
  db.gastos.forEach(function(g){filas.push([g.fecha,'','Gasto',g.concepto,'',-g.monto,'',''])});
  descargarCSV('samurai-caja-'+hoyIso()+'.csv',filas);
}

/* =====================================================================
   DATOS INICIALES · arranca vacío. Los clientes, la caja y el stock se arman
   solos con lo que se carga. Solo hay una lista de servicios con precio de
   partida (editable desde "Más"); no son datos de ningún cliente.
   ===================================================================== */
function seedVacio(){
  var servicios=[{n:'Corte',p:18000,dur:30},{n:'Corte + barba',p:22000,dur:30},{n:'Barba',p:12000,dur:30},{n:'Dos personas',p:36000,dur:60}];
  return {v:3,turnos:[],clientes:{},gastos:[],productos:[],ventas:[],servicios:servicios};
}
</script>
